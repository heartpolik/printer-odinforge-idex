#####################################################################
# IDEX tool handling: T0 (hugin, left/red) and T1 (munin, right/blue)
#####################################################################
# Tool change, carriage parking, COPY/MIRROR modes and the IDEX steps added to Klippain's
# START_PRINT (startprint_actions in odin/variables.cfg). Tool offsets: idex_offset_* in
# odin/variables.cfg. Part fan routing: odin/macros/part_fan.cfg.

[gcode_macro _IDEX_VARS]
description: Per-tool constants for the IDEX macros
# PARK X (gcode coords) for each tool, on its own side. T0/T1 copy theirs into
# _USER_VARIABLES.park_position_xy so Klippain's PARK (END_PRINT, PAUSE, CANCEL_PRINT)
# never sends the active carriage out of its range. T0 value = park_position_xy default.
variable_park_x_t0: -24
variable_park_x_t1: 257
gcode:

[gcode_macro _IDEX_SET_PARK]
description: Point Klippain's PARK at the given tool's side. Usage: _IDEX_SET_PARK TOOL=<0|1>
gcode:
  {% set vars = printer["gcode_macro _IDEX_VARS"] %}
  {% set px = vars.park_x_t1 if params.TOOL|int == 1 else vars.park_x_t0 %}
  {% set py = printer["gcode_macro _USER_VARIABLES"].park_position_xy[1] %}
  SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=park_position_xy VALUE="({px}, {py})"

[gcode_macro _PARK_extruder0]
description: Park red (left) carriage
gcode:
  {% if "x" in printer.toolhead.homed_axes %} 
    G90
    SAVE_GCODE_STATE  NAME=park0
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X{printer.configfile.settings.stepper_x.position_endstop} F{printer.configfile.settings.stepper_x.homing_speed*60}
    RESTORE_GCODE_STATE NAME=park0
  {% endif %}

[gcode_macro _PARK_extruder1]
description: Park right (blue) carriage
gcode:
  {% if "x" in printer.toolhead.homed_axes %}
    G90
    SAVE_GCODE_STATE  NAME=park1
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X{printer.configfile.settings.dual_carriage.position_endstop} F{printer.configfile.settings.dual_carriage.homing_speed*60}
    RESTORE_GCODE_STATE NAME=park1
  {% endif %}

# Tool offsets (_USER_VARIABLES idex_offset_*) are applied relative (X/Y/Z_ADJUST) so that any
# other gcode offset - START_PRINT's Z adjust, babystepping - survives tool changes.
# T0.offset_applied tracks whether the T1 offset is currently included in the gcode offset.
[gcode_macro T0]
description: Select Hugin (red carriage)
variable_offset_applied: 0
gcode:
    {% if "x" in printer.toolhead.homed_axes %} # this check ensures compatibility with Cura
        _PARK_extruder1
    {% endif %}
    # Part fan follows the tool: M106 keeps last_speed as 0..255
    SET_FAN_SPEED FAN=munin_part_fan SPEED=0
    SET_FAN_SPEED FAN=hugin_part_fan SPEED={printer["gcode_macro M106"].last_speed|float / 255}
    SET_DUAL_CARRIAGE CARRIAGE=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=''
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    {% if printer["gcode_macro T0"].offset_applied == 1 %}
        {% set uv = printer["gcode_macro _USER_VARIABLES"] %}
        SET_GCODE_OFFSET X_ADJUST={ -uv.idex_offset_x } Y_ADJUST={ -uv.idex_offset_y } Z_ADJUST={ -uv.idex_offset_z }
        SET_GCODE_VARIABLE MACRO=T0 VARIABLE=offset_applied VALUE=0
    {% endif %}
    _IDEX_SET_PARK TOOL=0

[gcode_macro T1]
description: Select Munin (blue carriage)
variable_carriage_bond: 0
gcode:
  {% if printer["gcode_macro T1"].carriage_bond == 1 %}
    RESPOND TYPE=error MSG="Unable switch toolhead in COPY/MIRROR mode!"
  {% else %}
      {% if "x" in printer.toolhead.homed_axes %} # this check ensures compatibility with Cura
          _PARK_extruder0
      {% endif %}
      SET_FAN_SPEED FAN=hugin_part_fan SPEED=0
      SET_FAN_SPEED FAN=munin_part_fan SPEED={printer["gcode_macro M106"].last_speed|float / 255}
      SET_DUAL_CARRIAGE CARRIAGE=1
      ACTIVATE_EXTRUDER EXTRUDER=extruder1
      SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=''
      SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
      {% if printer["gcode_macro T0"].offset_applied == 0 %}
          {% set uv = printer["gcode_macro _USER_VARIABLES"] %}
          SET_GCODE_OFFSET X_ADJUST={uv.idex_offset_x} Y_ADJUST={uv.idex_offset_y} Z_ADJUST={uv.idex_offset_z}
          SET_GCODE_VARIABLE MACRO=T0 VARIABLE=offset_applied VALUE=1
      {% endif %}
      _IDEX_SET_PARK TOOL=1
  {% endif %}

[gcode_macro IDEX_COPY_MODE]
description: Copy mode activation
gcode:
  {% set dc = printer.configfile.settings.dual_carriage %}
  {% set sx = printer.configfile.settings.stepper_x %}
  T0
  _PARK_extruder0
  G1 X0 F{dc.homing_speed*60}
  
  SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
  G90
  SAVE_GCODE_STATE NAME=park1
  G1 X{(dc.position_max - sx.position_min)/2} F{dc.homing_speed*60}
  RESTORE_GCODE_STATE NAME=park1
  SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
  SET_STEPPER_ENABLE STEPPER=extruder1 ENABLE=1
  SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
  M106 S{printer["gcode_macro M106"].last_speed}
  SET_GCODE_VARIABLE MACRO=T1 VARIABLE=carriage_bond VALUE=1

[gcode_macro IDEX_MIRROR_MODE]
description: Mirror mode activation
gcode:
  # T0 parks carriage 1 at its endstop; park carriage 0 too so both start mirrored
  T0
  _PARK_extruder0
  SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR  
  SET_STEPPER_ENABLE STEPPER=extruder1 ENABLE=1
  SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
  M106 S{printer["gcode_macro M106"].last_speed}
  SET_GCODE_VARIABLE MACRO=T1 VARIABLE=carriage_bond VALUE=1

[gcode_macro IDEX_PRIMARY_MODE]
description: Активация режима независимого управления каретками
gcode:
  
  _PARK_extruder0
  _PARK_extruder1

  SET_GCODE_VARIABLE MACRO=T1 VARIABLE=carriage_bond VALUE=0
  # Parking leaves carriage 1 primary; T0 restores a consistent tool (carriage 0 + extruder,
  # extruder1 unsynced from extruder's motion queue)
  T0

# START_PRINT actions (see startprint_actions in odin/variables.cfg)
[gcode_macro _START_PRINT_ACTION_IDEX_RESET]
description: Clear tool state left by a previous (possibly cancelled) print: T0, no tool offset
gcode:
  # START_PRINT already did SET_GCODE_OFFSET Z=0; drop a leftover T1 X/Y offset the same way
  SET_GCODE_OFFSET X=0 Y=0
  SET_GCODE_VARIABLE MACRO=T0 VARIABLE=offset_applied VALUE=0
  SET_GCODE_VARIABLE MACRO=T1 VARIABLE=carriage_bond VALUE=0
  T0

[gcode_macro _START_PRINT_ACTION_IDEX_INITIAL_TOOL]
description: Switch to START_PRINT's INITIAL_TOOL after probing (probe is on T0)
gcode:
  T{printer["gcode_macro START_PRINT"].initial_tool}
