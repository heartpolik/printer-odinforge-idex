#####################################################################
# Mainboard: BTT Manta M8P v2.0 (STM32H723, USB-to-CAN bridge)
#####################################################################
# Drives X, X1 (dual carriage), Y, Z, Z1, the bed heater and frame fans.
# Klippain's pin definitions for this board are included from printer.cfg.

[mcu]
canbus_uuid: 08ef01076113

# Pin aliases used by the rest of the config (motor slots, endstops, heaters, fans)
[board_pins mantam8p20_mcu]
mcu: mcu
aliases:
    X_STEP=MCU_M7_STEP   , X_DIR=MCU_M7_DIR   , X_ENABLE=MCU_M7_EN  , X_TMCUART=MCU_M7_CS  ,
    X1_STEP=MCU_M2_STEP  , X1_DIR=MCU_M2_DIR  , X1_ENABLE=MCU_M2_EN , X1_TMCUART=MCU_M2_CS ,

    Y_STEP=MCU_M3_STEP   , Y_DIR=MCU_M3_DIR   , Y_ENABLE=MCU_M3_EN  , Y_TMCUART=MCU_M3_CS  ,

    Z1_STEP=MCU_M1_STEP  , Z1_DIR=MCU_M1_DIR  , Z1_ENABLE=MCU_M1_EN , Z1_TMCUART=MCU_M1_CS ,
    Z_STEP=MCU_M8_STEP   , Z_DIR=MCU_M8_DIR   , Z_ENABLE=MCU_M8_EN  , Z_TMCUART=MCU_M8_CS  ,

    # E_STEP=MCU_M7_STEP  , E_DIR=MCU_M7_DIR  , E_ENABLE=MCU_M7_EN  , E_TMCUART=MCU_M7_CS  ,

    DRIVER_SPI_MOSI=MCU_M_SPI_MOSI , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_MISO=MCU_M_SPI_MISO , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_SCK=MCU_M_SPI_SCK   , # Used in case of SPI drivers such as TMC2240 or TMC5160

    X_STOP=MCU_M1_STOP ,
    X1_STOP=MCU_M2_STOP,
    Y_STOP=MCU_M3_STOP ,
    Z_STOP=MCU_M4_STOP ,
    PROBE_INPUT=MCU_PROBE2 ,
    RUNOUT_SENSOR=MCU_FWS1 ,

    E_HEATER=MCU_HE0       , E_TEMPERATURE=MCU_TH0   ,
    BED_HEATER=MCU_BED_OUT , BED_TEMPERATURE=MCU_THB ,

    PSU_FAN=MCU_FAN0 ,
    DRIVER_FAN=MCU_FAN1 ,
    # E_FAN=MCU_FAN1 ,
    HOST_CONTROLLER_FAN=MCU_FAN2 ,
    EXHAUST_FAN=MCU_FAN3 ,
    FILTER_FAN=MCU_FAN4 ,
    # HOST_CONTROLLER_FAN=MCU_FAN5 ,

    CHAMBER_TEMPERATURE=MCU_TH1 ,
    ELECTRICAL_CABINET_TEMPERATURE=MCU_TH2 ,
    PSU_TEMPERATURE=MCU_TH3 ,

    LIGHT_OUTPUT=MCU_HE2 ,
    STATUS_NEOPIXEL=MCU_RGB1 ,
    LIGHT_NEOPIXEL=MCU_M5_STOP ,

    SERVO_PIN=MCU_PROBE1 ,
