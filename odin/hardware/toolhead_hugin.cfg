#####################################################################
# Toolhead T0 "hugin" (left carriage, red): BTT EBB36/42 v1.2 over CAN
#####################################################################
# Extruder, hotend and part fans, Micro Probe (the only probe on the machine), ADXL345 for
# input shaping, status LEDs and the filament runout switch.

[mcu hugin]
canbus_uuid: 62171040ce8f ##red

# EBB36/42 v1.2 pinout (inlined from Klippain's mcu_definitions/toolhead/BTT_EBB36-42_v1.2.cfg)
[board_pins toolhead_manufacturer]
mcu: hugin
aliases:
    MCU_TMCDRIVER_STEP=PD0 , MCU_TMCDRIVER_DIR=PD1 , MCU_TMCDRIVER_ENABLE=PD2 , MCU_TMCDRIVER_UART=PA15 ,

    MCU_ENDSTOP1=PB6 , MCU_ENDSTOP2=PB5 , MCU_ENDSTOP3=PB7 ,
    MCU_PROBE=PB8 ,
    MCU_SERVOS=PB9 ,

    MCU_HOTEND0=PB13 ,
    MCU_TH0=PA3 ,

    MCU_FAN1=PA0 , MCU_FAN2=PA1 ,

    MCU_RGB=PD3 ,

    MCU_SPI1_CS=PA4  , MCU_SPI1_SCLK=PA5  , MCU_SPI1_MISO=PA6 , MCU_SPI1_MOSI=PA7  ,
    MCU_SPI2_CS=PB12 , MCU_SPI2_SCLK=PB10 , MCU_SPI2_MISO=PB2 , MCU_SPI2_MOSI=PB11 ,

# Functional aliases used below (hugin:E_STEP, hugin:PROBE_INPUT, ...)
[board_pins ebb_mcu]
mcu: hugin
aliases:
    E_STEP=MCU_TMCDRIVER_STEP , E_DIR=MCU_TMCDRIVER_DIR , E_ENABLE=MCU_TMCDRIVER_ENABLE , E_TMCUART=MCU_TMCDRIVER_UART ,

    # X_STOP=MCU_ENDSTOP1 ,
    # Y_STOP=MCU_ENDSTOP2 ,
    PROBE_INPUT=MCU_PROBE ,
    SERVO_PIN=MCU_SERVOS ,
    TOOLHEAD_SENSOR=MCU_ENDSTOP3 ,

    E_HEATER=MCU_HOTEND0 ,
    E_TEMPERATURE=MCU_TH0 ,

    PART_FAN=MCU_FAN1 ,
    E_FAN=MCU_FAN2 ,

    STATUS_NEOPIXEL=MCU_RGB ,

    ADXL_CS=MCU_SPI2_CS , ADXL_SCLK=MCU_SPI2_SCLK , ADXL_MISO=MCU_SPI2_MISO , ADXL_MOSI=MCU_SPI2_MOSI ,

[temperature_sensor hugin_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: hugin
min_temp: 0
max_temp: 100

#--------------------------------------------------------------------
# Extruder (CW2 motor, Klippain's cw2.cfg provides the base settings)
#--------------------------------------------------------------------
[extruder]
step_pin: hugin:E_STEP
dir_pin: !hugin:E_DIR
enable_pin: !hugin:E_ENABLE
heater_pin: hugin:E_HEATER
sensor_pin: hugin:E_TEMPERATURE

rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 110
max_extrude_cross_section: 5
sensor_type: ATC Semitec 104GT-2
min_temp: 10
max_temp: 270
max_power: 1.0
min_extrude_temp: 172
pressure_advance: 0.0475
pressure_advance_smooth_time: 0.040

control: pid
pid_kp: 36.698
pid_ki: 4.369
pid_kd: 77.065

[tmc2209 extruder]
uart_pin: hugin:E_TMCUART

#--------------------------------------------------------------------
# Fans
#--------------------------------------------------------------------
# Part fan is driven by M106/M107 (odin/macros/part_fan.cfg)
[fan_generic hugin_part_fan]
pin: hugin:PART_FAN

[heater_fan hugin_hotend_fan]
pin: hugin:E_FAN
heater: extruder

#--------------------------------------------------------------------
# Probe: Micro Probe, deployed through the servo pin
#--------------------------------------------------------------------
[output_pin probe_enable]
pin: hugin:SERVO_PIN
value: 0

[gcode_macro ACTIVATE_PROBE]
gcode:
  SET_PIN PIN=probe_enable VALUE=1

[gcode_macro DEACTIVATE_PROBE]
gcode:
  SET_PIN PIN=probe_enable VALUE=0

[probe]
pin: ^!hugin:PROBE_INPUT # For V1 version, set to ^PC13 for high-level trigger; for V2 version,
deactivate_on_each_sample: False
x_offset: -28.45 # Actual offset of the MicroProbe installation
y_offset: 23.6 # Actual offset of the MicroProbe installation
z_offset: 0.561 # Actual offset of the MicroProbe installation

speed: 5.0
activate_gcode:
  ACTIVATE_PROBE
  G4 P500 # Allow 500 milliseconds for the probe to deploy
deactivate_gcode:
  DEACTIVATE_PROBE

#--------------------------------------------------------------------
# Accelerometer (X axis resonance; Y uses the bed module when plugged in,
# see odin/hardware/accel_bed_ytest.cfg)
#--------------------------------------------------------------------
[adxl345]
cs_pin: hugin:ADXL_CS
spi_software_sclk_pin: hugin:ADXL_SCLK
spi_software_mosi_pin: hugin:ADXL_MOSI
spi_software_miso_pin: hugin:ADXL_MISO

[resonance_tester]
# Split into accel_chip_x/accel_chip_y (both default to the toolhead chip) instead of a
# single accel_chip, so the temporary Y-axis bed accelerometer (odin/hardware/accel_bed_ytest.cfg)
# can override just accel_chip_y without Klipper flagging accel_chip
# as an unused/invalid option (the two forms can't coexist in one merged config).
accel_chip_x: adxl345
accel_chip_y: adxl345
probe_points:
    60,60,20  # an example

#--------------------------------------------------------------------
# Status LEDs and filament sensor (Klippain sections, pins moved to this board)
#--------------------------------------------------------------------
[neopixel status_leds]
pin: hugin:STATUS_NEOPIXEL

[filament_switch_sensor runout_sensor]
switch_pin: ^hugin:TOOLHEAD_SENSOR
