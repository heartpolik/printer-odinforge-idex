#####################################################################
# Electronics bay: driver and PSU cooling
#####################################################################
# Toolhead fans live in toolhead_*.cfg; the Pi/host fan comes from Klippain's rpi_fan.cfg.

# Runs while any stepper or heater is active (Klipper defaults: 30s idle timeout)
[controller_fan drivers_fan]
pin: DRIVER_FAN
max_power: 0.6

# PSU fan, thermostatic on the PSU thermistor
[temperature_fan PSU_fan]
pin: PSU_FAN
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PSU_TEMPERATURE
control: watermark
min_temp: 10
max_temp: 80
