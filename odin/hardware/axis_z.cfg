#####################################################################
# Z axis: two lead screws (left Z, right Z1), homed with the probe
#####################################################################

[stepper_z]

position_max: 270
position_min: -16

endstop_pin: probe:z_virtual_endstop
# endstop_pin: Z_STOP
rotation_distance: 8
microsteps: 32
full_steps_per_rotation: 200

# position_endstop: 3.634

homing_speed: 15
second_homing_speed: 8
homing_retract_dist: 3.0

step_pin: Z_STEP
dir_pin: !Z_DIR
enable_pin: !Z_ENABLE

[tmc2209 stepper_z]
uart_pin: Z_TMCUART
interpolate: True
run_current: 0.65
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
rotation_distance: 8
microsteps: 32
full_steps_per_rotation: 200

step_pin: Z1_STEP
dir_pin: !Z1_DIR
enable_pin: !Z1_ENABLE

[tmc2209 stepper_z1]
uart_pin: Z1_TMCUART
interpolate: True
run_current: 0.65
sense_resistor: 0.110
stealthchop_threshold: 0

# Gantry levelling over the two lead screws (points are probe positions)
[z_tilt]
z_positions:
    -25, 115
    257, 115
points:
    44.45, 107.4
    218.45, 107.4
speed: 350
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
