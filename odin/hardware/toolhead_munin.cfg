#####################################################################
# Toolhead T1 "munin" (right carriage, blue): BTT EBB36/42 v1.2 over CAN
#####################################################################
# Extruder, hotend and part fans, LEDs. No probe: all probing is done with T0.

[mcu munin]
canbus_uuid: 7517e0819073 ##blue

# EBB36/42 v1.2 pinout (same board as hugin)
[board_pins toolhead_manufacturer_munin]
mcu: munin
aliases:
    MCU_TMCDRIVER_STEP=PD0 , MCU_TMCDRIVER_DIR=PD1 , MCU_TMCDRIVER_ENABLE=PD2 , MCU_TMCDRIVER_UART=PA15 ,

    MCU_ENDSTOP1=PB6 , MCU_ENDSTOP2=PB5 , MCU_ENDSTOP3=PB7 ,
    MCU_PROBE=PB8 ,
    MCU_SERVOS=PB9 ,

    MCU_HOTEND0=PB13 ,
    MCU_TH0=PA3 ,

    MCU_FAN1=PA0 , MCU_FAN2=PA1 ,

    MCU_RGB=PD3 ,

    MCU_SPI1_CS=PA4  , MCU_SPI1_SCLK=PA5  , MCU_SPI1_MISO=PA6 , MCU_SPI1_MOSI=PA7  ,
    MCU_SPI2_CS=PB12 , MCU_SPI2_SCLK=PB10 , MCU_SPI2_MISO=PB2 , MCU_SPI2_MOSI=PB11 ,

[board_pins ebb_mcu_munin]
mcu: munin
aliases:
    E_STEP=MCU_TMCDRIVER_STEP , E_DIR=MCU_TMCDRIVER_DIR , E_ENABLE=MCU_TMCDRIVER_ENABLE , E_TMCUART=MCU_TMCDRIVER_UART ,

    PROBE_INPUT=MCU_PROBE ,
    SERVO_PIN=MCU_SERVOS ,
    TOOLHEAD_SENSOR=MCU_ENDSTOP3 ,

    E_HEATER=MCU_HOTEND0 ,
    E_TEMPERATURE=MCU_TH0 ,

    PART_FAN=MCU_FAN1 ,
    E_FAN=MCU_FAN2 ,

    STATUS_NEOPIXEL=MCU_RGB ,

    ADXL_CS=MCU_SPI2_CS , ADXL_SCLK=MCU_SPI2_SCLK , ADXL_MISO=MCU_SPI2_MISO , ADXL_MOSI=MCU_SPI2_MOSI ,

[temperature_sensor munin_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: munin
min_temp: 0
max_temp: 100

#--------------------------------------------------------------------
# Extruder (same hardware as hugin)
#--------------------------------------------------------------------
[extruder1]
step_pin: munin:E_STEP
dir_pin: !munin:E_DIR
enable_pin: !munin:E_ENABLE
heater_pin: munin:E_HEATER
sensor_pin: munin:E_TEMPERATURE

rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 110
max_extrude_cross_section: 5
sensor_type: ATC Semitec 104GT-2
min_temp: 10
max_temp: 270
max_power: 1.0
min_extrude_temp: 172
pressure_advance: 0.0475
pressure_advance_smooth_time: 0.040

control: pid
pid_kp: 36.698
pid_ki: 4.369
pid_kd: 77.065

[tmc2209 extruder1]
uart_pin: munin:E_TMCUART
interpolate: True
run_current: 0.45
sense_resistor: 0.110
stealthchop_threshold: 0

#--------------------------------------------------------------------
# Fans
#--------------------------------------------------------------------
# Part fan is driven by M106/M107 (odin/macros/part_fan.cfg)
[fan_generic munin_part_fan]
pin: munin:PART_FAN

[heater_fan munin_hotend_fan]
pin: munin:E_FAN
heater: extruder1

#--------------------------------------------------------------------
# LEDs
#--------------------------------------------------------------------
[neopixel munin_leds]
pin: munin:STATUS_NEOPIXEL
chain_count: 2
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0
