#####################################################################
# Y axis (bed slinger: the bed moves on Y)
#####################################################################

[stepper_y]
position_min: -60
position_endstop: -56
position_max: 275

rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

step_pin: Y_STEP
dir_pin: Y_DIR
enable_pin: !Y_ENABLE
endstop_pin: !Y_STOP

homing_speed: 100
# endstop_pin: tmc2209_stepper_y:virtual_endstop

[tmc2209 stepper_y]
uart_pin: Y_TMCUART
interpolate: True
run_current: 0.85
sense_resistor: 0.110
stealthchop_threshold: 0
# diag_pin: ^Y_STOP
driver_SGTHRS: 75

# Y motor is a slightly longer/different unit than X's, not the same winding - measured separately.
# resistance/inductance measured directly (LCR meter @ 1kHz, 2026-07-20): L=3.505mH, R=6.08ohm.
# holding_torque/max_current not measured - kept at the klipper_tmc_autotune "creality-42-34"
# reference values (same 42-34 frame class) as an estimate.
[motor_constants kobra_go_y_measured]
resistance: 6.08
inductance: 0.003505
holding_torque: 0.4
max_current: 1.0
steps_per_revolution: 200

[autotune_tmc stepper_y]
motor: kobra_go_y_measured
