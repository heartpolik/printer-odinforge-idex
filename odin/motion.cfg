#####################################################################
# Motion limits and tuning
#####################################################################

# AUTO SPEED found recommended acceleration and velocity after 208.16s
# | X max: a39574 v1380
# | Y max: a11730 v374
# Recommended accel: 11730
# Recommended velocity: 374

[printer]
# AUTO_SPEED result (2026-07-20): raw max X=1725/Y=862 accel=97937,
# recommended (with safety margin) below.
max_velocity: 690
max_accel: 15000

# klipper_auto_speed plugin (AUTO_SPEED command)
[auto_speed]

[force_move]
enable_force_move: true

#--------------------------------------------------------------------
# Input shaper
#--------------------------------------------------------------------
# Klippain's input_shaper.cfg is not included: with dual_carriage each carriage needs its own
# SET_INPUT_SHAPER, done at boot below.
[input_shaper]
# Section intentionally empty - shaper set per-carriage below via delayed_gcode.
# X1 (munin) reuses X0's calibrated values as a starting point - not yet
# independently calibrated, redo INPUT_SHAPER_CALIBRATE on carriage 1 separately.

[delayed_gcode init_shaper]
initial_duration: 0.1
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=1
    SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=83.4 SHAPER_TYPE_Y=mzv SHAPER_FREQ_Y=35.4
    SET_DUAL_CARRIAGE CARRIAGE=0
    SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=83.4 SHAPER_TYPE_Y=mzv SHAPER_FREQ_Y=35.4

#--------------------------------------------------------------------
# Geometry
#--------------------------------------------------------------------
# XY skew profile "CaliFlower" is stored in the SAVE_CONFIG block of printer.cfg
[skew_correction]

# Native G2/G3 arcs, so the slicer's "Arc fitting" produces smooth curves instead of many
# tiny G1 segments. resolution is the max segment length (mm) each arc is cut into.
[gcode_arcs]
resolution: 0.5
