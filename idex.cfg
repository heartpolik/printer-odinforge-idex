[gcode_macro _PARK_extruder0]
description: Park red (left) carriage
gcode:
  {% if "x" in printer.toolhead.homed_axes %} 
    G90
    SAVE_GCODE_STATE  NAME=park0
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X{printer.configfile.config.stepper_x.position_endstop} F{printer.configfile.config.stepper_x.homing_speed|int*60}
    RESTORE_GCODE_STATE NAME=park0
  {% endif %}

[gcode_macro _PARK_extruder1]
description: Park right (blue) carriage
gcode:
  {% if "x" in printer.toolhead.homed_axes %}
    G90
    SAVE_GCODE_STATE  NAME=park1
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X{printer.configfile.config.dual_carriage.position_endstop} F{printer.configfile.config.dual_carriage.homing_speed|int*60}
    RESTORE_GCODE_STATE NAME=park1
  {% endif %}

[gcode_macro T0]
description: Select Hugin (red carriage)
variable_offset_applied: 0
gcode:
  {% set svv = printer.save_variables.variables %}
    {% if "x" in printer.toolhead.homed_axes %} # this check ensures compatibility with Cura
        _PARK_extruder1
    {% endif %}
    {% set fan_speed = printer["gcode_macro M106"].last_speed %}
      {% if fan_speed != -1 %}
        SET_FAN_SPEED FAN=hugin_part_fan SPEED={fan_speed}
      {% else %}
        # Update core Klipper's fan speed to the fan speed of the active toolhead
        # Only do this if you have a sacrificial [fan] section
        #M106.1 S{printer["fan_generic fan_extruder"].speed * 255}
    {% endif %}
    SET_DUAL_CARRIAGE CARRIAGE=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=''
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    {% if printer["gcode_macro T0"].offset_applied == 1 %}
        {% set x_offset = printer["gcode_macro _USER_VARIABLES"].idex_offset_x %}
        {% set y_offset = printer["gcode_macro _USER_VARIABLES"].idex_offset_y %}
        {% set z_offset = printer["gcode_macro _USER_VARIABLES"].idex_offset_z %}
        SET_GCODE_OFFSET  X_ADJUST={ -(x_offset) } Y_ADJUST={ -(y_offset) } Z_ADJUST={ -(z_offset) }
        SET_GCODE_VARIABLE MACRO=T0 VARIABLE=offset_applied VALUE=0
    {% endif %}

[gcode_macro T1]
description: Select Munin (blue carriage)
variable_carriage_bond: 0
gcode:
  {% if printer["gcode_macro T1"].carriage_bond == 1 %}
    RESPOND TYPE=error MSG="Unable switch toolhead in COPY/MIRROR mode!"
  {% else %}
    {% set svv = printer.save_variables.variables %}
      {% if "x" in printer.toolhead.homed_axes %} # this check ensures compatibility with Cura
          _PARK_extruder0
      {% endif %}
      {% set fan_speed = printer["gcode_macro M106"].last_speed %}
        {% if fan_speed != -1 %}
          SET_FAN_SPEED FAN=munin_part_fan SPEED={fan_speed}
        {% else %}
          # Update core Klipper's fan speed to the fan speed of the active toolhead
          # Only do this if you have a sacrificial [fan] section
          #M106.1 S{printer["fan_generic fan_extruder1"].speed * 255}
      {% endif %}
      SET_DUAL_CARRIAGE CARRIAGE=1
      ACTIVATE_EXTRUDER EXTRUDER=extruder1
      SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=''
      SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
      {% if printer["gcode_macro T0"].offset_applied == 0 %}
          {% set x_offset = printer["gcode_macro _USER_VARIABLES"].idex_offset_x %}
          {% set y_offset = printer["gcode_macro _USER_VARIABLES"].idex_offset_y %}
          {% set z_offset = printer["gcode_macro _USER_VARIABLES"].idex_offset_z %}
          SET_GCODE_OFFSET  X={x_offset|default(0.0)} Y={y_offset|default(0.0)} Z={z_offset|default(0.0)}
          SET_GCODE_VARIABLE MACRO=T0 VARIABLE=offset_applied VALUE=1
      {% endif %}
  {% endif %}

[gcode_macro IDEX_COPY_MODE]
description: Copy mode activation
gcode:
  T0
  PARK_{printer.toolhead.extruder}
  G1 X0 F{printer.configfile.config.dual_carriage.homing_speed|int*60}
  
  SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
  G90
  SAVE_GCODE_STATE NAME=park1
  G1 X{(printer.configfile.config.dual_carriage.position_max - printer.configfile.config.stepper_x.position_min)/2} F{printer.configfile.config.dual_carriage.homing_speed|int*60}
  RESTORE_GCODE_STATE NAME=park1
  SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
  SET_STEPPER_ENABLE STEPPER=extruder1 ENABLE=1
  SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
  M106 S{printer["gcode_macro M106"].last_speed}
  SET_GCODE_VARIABLE MACRO=T1 VARIABLE=carriage_bond VALUE=1


[gcode_macro IDEX_MIRROR_MODE]
description: Mirror mode activation
gcode:
  T0
  _PARK_{printer.toolhead.extruder}
  SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR  
  SET_STEPPER_ENABLE STEPPER=extruder1 ENABLE=1
  SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
  M106 S{printer["gcode_macro M106"].last_speed}
  SET_GCODE_VARIABLE MACRO=T1 VARIABLE=carriage_bond VALUE=1

[gcode_macro IDEX_PRIMARY_MODE]
description: Активация режима независимого управления каретками
gcode:
  
  _PARK_extruder0
  _PARK_extruder1

  SET_GCODE_VARIABLE MACRO=T1 VARIABLE=carriage_bond VALUE=0



[input_shaper]
# Section intentionally empty - shaper set per-carriage below via delayed_gcode.
# X1 (munin) reuses X0's calibrated values as a starting point - not yet
# independently calibrated, redo INPUT_SHAPER_CALIBRATE on carriage 1 separately.

[delayed_gcode init_shaper]
initial_duration: 0.1
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=1
    SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=83.4 SHAPER_TYPE_Y=mzv SHAPER_FREQ_Y=35.4
    SET_DUAL_CARRIAGE CARRIAGE=0
    SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=83.4 SHAPER_TYPE_Y=mzv SHAPER_FREQ_Y=35.4
