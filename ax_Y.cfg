[gcode_macro _USER_VARIABLES]
variable_y_driver: "tmc2209"
gcode:

[stepper_y]
position_min: -60
position_endstop: -55
position_max: 275

rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

step_pin: Y_STEP
dir_pin: !Y_DIR
enable_pin: !Y_ENABLE
endstop_pin: Y_STOP

homing_speed: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop

[tmc2209 stepper_y]
uart_pin: Y_TMCUART
interpolate: True
run_current: 0.85
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^Y_STOP
driver_SGTHRS: 75