#############################################
#   CUSTOM USER MACROS                     #
#############################################
# Кастомні макроси, створені користувачем
# Цей файл містить додаткові макроси, які не входять в базову конфігурацію

#-------------------------#
#   NOZZLE OFFSETS        #
#-------------------------#

[gcode_macro OLD_NOZZLE_OFFSETS]
description: 'Порівнює висоти двох екструдерів за допомогою Z-проби'
gcode:
    {% set probe_x = printer["gcode_macro _USER_VARIABLES"].endstop_xy_position[0] %}
    {% set probe_y = printer["gcode_macro _USER_VARIABLES"].endstop_xy_position[1] %}
    {% set lift_z = 15 %}

    RESPOND MSG="Endstop position at X{probe_x} Y{probe_y}"

    G90
    G0 Z{lift_z}

    RESPOND MSG="Проба Z для екструдера T0"
    T0
    G0 X{probe_x} Y{probe_y} F6000
    G28 Z
    {% set z0 = printer.toolhead.position.z %}

    RESPOND MSG="Сопло Т0 на висоті {z0}"

    G0 Z{lift_z}

    RESPOND MSG="Проба Z для екструдера T1"
    # Probe є тільки на T0, тому використовуємо T0 для вимірювання T1
    # Спочатку перемикаємо на T1 для правильного позиціонування
    T1
    G0 X{probe_x} Y{probe_y} F6000
    # Перемикаємо на T0 для використання probe
    T0
    G0 X{probe_x} Y{probe_y} F6000
    G28 Z
    {% set z1 = printer.toolhead.position.z %}

    RESPOND MSG="Сопло Т1 на висоті {z1}"

    {% set diff = z1 - z0 %}
    {% set msg = "Різниця між T1 і T0: %.3f мм" % diff %}
    M117 {msg}
    RESPOND PREFIX="Z-OFFSET" MSG="{msg}"


[gcode_macro old2_NOZZLE_OFFSETS]
variable_z0: 0
variable_z1: 0
gcode:
    {% set probe_x = printer["gcode_macro _USER_VARIABLES"].endstop_xy_position[0] %}
    {% set probe_y = printer["gcode_macro _USER_VARIABLES"].endstop_xy_position[1] %}
    {% set lift_z = 15 %}

    RESPOND MSG="Endstop position at X{probe_x} Y{probe_y}"
    G90
    G0 Z{lift_z}

    RESPOND MSG="Проба Z для екструдера T0"
    T0
    G0 X{probe_x} Y{probe_y} F6000
    G28 Z
    # викликаємо під-макрос, який при виклику збереже поточну Z у змінну z0
    NOZZLE_STORE NAME=z0

    G0 Z{lift_z}

    RESPOND MSG="Проба Z для екструдера T1"
    # Probe є тільки на T0, тому використовуємо T0 для вимірювання T1
    # Спочатку перемикаємо на T1 для правильного позиціонування
    T1
    G0 X{probe_x} Y{probe_y} F6000
    # Перемикаємо на T0 для використання probe
    T0
    G0 X{probe_x} Y{probe_y} F6000
    G28 Z
    NOZZLE_STORE NAME=z1

    # після того як обидва значення збережені — викликаємо звіт
    NOZZLE_OFFSETS_REPORT

[gcode_macro NOZZLE_STORE]
gcode:
    {% if 'NAME' not in params %}
      RESPOND MSG="NOZZLE_STORE requires NAME parameter (e.g., NOZZLE_STORE NAME=z0)"
    {% else %}
      # цей макрос буде ОЦІНЕНО при виклику (після G28) — тому тут буде актуальна позиція
      SET_GCODE_VARIABLE MACRO=old2_NOZZLE_OFFSETS VARIABLE={params.NAME} VALUE={printer.toolhead.position.z}
      RESPOND MSG="Stored {params.NAME} = {printer.toolhead.position.z}"
    {% endif %}

[gcode_macro NOZZLE_OFFSETS_REPORT]
gcode:
    {% set m = printer['gcode_macro old2_NOZZLE_OFFSETS'] %}
    {% set z0 = m.z0|float %}
    {% set z1 = m.z1|float %}
    {% set diff = z1 - z0 %}
    {% set msg = "Різниця між T1 і T0: %.3f мм" % diff %}
    M117 {msg}
    RESPOND PREFIX="Z-OFFSET" MSG="{msg}"
    RESPOND MSG="T0: {z0}  T1: {z1}"


#-------------------------#
#   RETRACT MACROS        #
#-------------------------#

[gcode_macro RETRACT_CLEAN]
description: Акуратний ретракт з формуванням краю для E3D V6 (теплова зона 4-5 мм)
gcode:
    # Параметри ретракту (використовуємо змінні з variables.cfg або значення за замовчуванням)
    {% set RETRACT_LENGTH = params.LENGTH|default(printer["gcode_macro _USER_VARIABLES"].park_retract_length|default(4.5))|float %}  # Довжина ретракту (4-5 мм для E3D V6)
    {% set RETRACT_SPEED = params.SPEED|default(printer["gcode_macro _USER_VARIABLES"].park_retract_speed|default(35))|float %}     # Швидкість ретракту (мм/с)
    {% set Z_HOP = params.Z_HOP|default(printer["gcode_macro _USER_VARIABLES"].park_retract_zhop|default(0.3))|float %}            # Підйом сопла для формування краю (мм)
    {% set WIPE_DISTANCE = params.WIPE|default(printer["gcode_macro _USER_VARIABLES"].park_retract_wipe|default(2))|float %}       # Відстань для "відрізання" краю (мм)
    
    # Зберігаємо поточну позицію
    SAVE_GCODE_STATE NAME=retract_state
    
    # Невеликий рух для формування акуратного краю перед ретрактом
    {% if WIPE_DISTANCE > 0 %}
        G91
        G1 E-0.2 F{ RETRACT_SPEED * 0.5 }  # Невеликий попередній ретракт для початку формування
        G90
    {% endif %}
    
    # Підйом сопла для формування краю (якщо потрібно)
    {% if Z_HOP > 0 %}
        G91
        G1 Z{Z_HOP} F600  # Підйом сопла
        G90
    {% endif %}
    
    # Основний ретракт - витягуємо пластик з теплової зони
    G91
    G1 E-{RETRACT_LENGTH} F{RETRACT_SPEED * 60}  # Ретракт на 4-5 мм з оптимальною швидкістю
    G90
    
    # Невелика пауза для затвердіння краю
    G4 P100  # 100 мс пауза
    
    # Додатковий невеликий рух для остаточного формування краю (опціонально)
    {% if WIPE_DISTANCE > 0 %}
        G91
        G1 X{WIPE_DISTANCE} F1200  # Невеликий рух для "відрізання" краю
        G1 X-{WIPE_DISTANCE} F1200  # Повернення
        G90
    {% endif %}
    
    # Повертаємо сопло на місце (якщо був Z-hop)
    {% if Z_HOP > 0 %}
        G91
        G1 Z-{Z_HOP} F600  # Опускаємо сопло назад
        G90
    {% endif %}
    
    # Відновлюємо стан
    RESTORE_GCODE_STATE NAME=retract_state
    
    RESPOND MSG="Ретракт виконано: {RETRACT_LENGTH} мм зі швидкістю {RETRACT_SPEED} мм/с"


[gcode_macro UNRETRACT_CLEAN]
description: Повернення пластику в зону плавлення після ретракту
gcode:
    # Параметри unretract (використовуємо змінні з variables.cfg або значення за замовчуванням)
    {% set UNRETRACT_LENGTH = params.LENGTH|default(printer["gcode_macro _USER_VARIABLES"].park_unretract_length|default(5.0))|float %}  # Довжина unretract (трохи більше ніж ретракт)
    {% set UNRETRACT_SPEED = params.SPEED|default(printer["gcode_macro _USER_VARIABLES"].park_unretract_speed|default(25))|float %}     # Швидкість unretract (мм/с)
    {% set PRIME_LENGTH = params.PRIME|default(printer["gcode_macro _USER_VARIABLES"].park_unretract_prime|default(1.0))|float %}   # Додатковий prime для тиску (мм)
    
    # Зберігаємо поточну позицію
    SAVE_GCODE_STATE NAME=unretract_state
    
    # Повертаємо пластик в зону плавлення
    G91
    G1 E{UNRETRACT_LENGTH} F{UNRETRACT_SPEED * 60}  # Unretract з оптимальною швидкістю
    G90
    
    # Невелика пауза для стабілізації
    G4 P150  # 150 мс пауза
    
    # Додатковий prime для створення тиску в соплі
    {% if PRIME_LENGTH > 0 %}
        G91
        G1 E{PRIME_LENGTH} F{UNRETRACT_SPEED * 0.8 * 60}  # Невеликий prime для тиску
        G90
        G4 P50  # Коротка пауза
    {% endif %}
    
    # Відновлюємо стан
    RESTORE_GCODE_STATE NAME=unretract_state
    
    RESPOND MSG="Unretract виконано: {UNRETRACT_LENGTH} мм зі швидкістю {UNRETRACT_SPEED} мм/с"


#-------------------------#
#   PRE-PRINT PURGE       #
#-------------------------#

[gcode_macro _MODULE_PRE_PRINT_PURGE]
gcode:
    # ----- PRE-PRINT PURGE -------------------------------------------
    # Невеликий purge перед початком друку на позиції парковки активного інструменту
    {% set INITIAL_TOOL = printer["gcode_macro START_PRINT"].initial_tool %}
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}
    
    # Параметри purge (можна налаштувати через змінні)
    {% set purge_length = printer["gcode_macro _USER_VARIABLES"].pre_print_purge_length|default(15)|float %}  # Довжина purge (мм)
    {% set purge_speed = printer["gcode_macro _USER_VARIABLES"].pre_print_purge_speed|default(300)|float %}  # Швидкість purge (мм/хв)
    {% set purge_z_height = printer["gcode_macro _USER_VARIABLES"].pre_print_purge_z|default(5)|float %}  # Висота Z для purge (мм)
    
    # Активуємо активний інструмент
    T{INITIAL_TOOL}
    
    {% if verbose %}
        RESPOND MSG="Виконуємо pre-print purge для інструменту T{INITIAL_TOOL}..."
    {% endif %}
    
    # Визначаємо положення парковки для активного інструменту (purge bucket)
    {% if INITIAL_TOOL == 0 %}
        {% set park_x = printer.configfile.config.stepper_x.position_endstop %}
    {% else %}
        {% set park_x = printer.configfile.config.dual_carriage.position_endstop %}
    {% endif %}
    
    # Y координата - використовуємо з purge_bucket_xyz якщо встановлена, інакше поточний Y
    {% set purge_bucket_xyz = printer["gcode_macro _USER_VARIABLES"].purge_bucket_xyz|default("-1, -1, -1")|string %}
    {% set purge_y = printer.toolhead.position.y %}
    {% if purge_bucket_xyz != "-1, -1, -1" %}
        {% set purge_bucket_list = purge_bucket_xyz.split(", ") %}
        {% if purge_bucket_list|length >= 2 %}
            {% set purge_bucket_y = purge_bucket_list[1]|float %}
            {% if purge_bucket_y >= 0 %}
                {% set purge_y = purge_bucket_y %}
            {% endif %}
        {% endif %}
    {% endif %}
    
    # Переміщуємося на позицію парковки (purge bucket)
    G90
    G0 X{park_x} Y{purge_y} Z{purge_z_height} F6000
    
    # Невелика пауза для стабілізації
    G4 P200
    
    # Виконуємо purge
    G91
    G1 E{purge_length} F{purge_speed}
    G90
    
    # Невелика пауза після purge
    G4 P300
    
    {% if verbose %}
        RESPOND MSG="Pre-print purge завершено"
    {% endif %}

