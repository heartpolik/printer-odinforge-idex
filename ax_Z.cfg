[stepper_z]

position_max: 210
position_min: -16

endstop_pin: Z_STOP
rotation_distance: 8
microsteps: 32
full_steps_per_rotation: 200

position_endstop: 3.634

homing_speed: 15
second_homing_speed: 8
homing_retract_dist: 3.0

step_pin: Z_STEP
dir_pin: !Z_DIR
enable_pin: !Z_ENABLE

[stepper_z1]
rotation_distance: 8
microsteps: 32
full_steps_per_rotation: 200

step_pin: Z1_STEP
dir_pin: !Z1_DIR
enable_pin: !Z1_ENABLE


[tmc2209 stepper_z1]
uart_pin: Z1_TMCUART
interpolate: True
run_current: 0.65
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: Z_TMCUART
interpolate: True
run_current: 0.65
sense_resistor: 0.110
stealthchop_threshold: 0

[z_tilt]
z_positions:
    -25, 115
    257, 115
points:
    -2, 115
    202, 115
speed: 350
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.0075
