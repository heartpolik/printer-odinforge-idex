# Temporary Y-axis bed accelerometer: BigTreeTech ADXL345 V2.0.1
# This is an all-in-one USB module (its own RP2040 running Klipper + onboard ADXL345),
# not a bare chip wired to the main board. Fixed factory SPI pins per the official manual
# (https://github.com/bigtreetech/ADXL345, BIGTREETECH_ADXL345_V2.0_User_Manual):
#   MISO=GPIO8  CS=GPIO9  CLK=GPIO10  MOSI=GPIO11
# This board is a bed-slinger on Y (the bed moves, not the toolhead), so the toolhead-mounted
# accelerometer alone can't measure Y resonance — this second chip rides on the bed for that.
#
# Only include this file while the module is actually plugged in via USB (see the toggle
# line in overrides.cfg). With it unplugged, Klipper will fail to start if this is active.

[mcu bed]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504450612884111C-if00

[adxl345 bed]
cs_pin: bed:gpio9
spi_software_sclk_pin: bed:gpio10
spi_software_mosi_pin: bed:gpio11
spi_software_miso_pin: bed:gpio8
# axes_map may need adjusting to match how the module is physically oriented on the bed
# (per manual: 1st axis = reading when printer X+ moves, 2nd = when Y+ moves). Default below
# assumes the module's silkscreen +X/+Y/+Z arrows align with the printer's own axes.
axes_map: x,y,z

[resonance_tester]
accel_chip_y: adxl345 bed
