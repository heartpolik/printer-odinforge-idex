#---------------------------------------------#
#### BTT Manta M8P v2.0 MCU definition ########
#---------------------------------------------#

[mcu]
canbus_uuid: 08ef01076113
##--------------------------------------------------------------------

[include config/mcu_definitions/main/BTT_Manta_M8P_v2.0.cfg] # Do not remove this line
[board_pins mantam8p20_mcu]
mcu: mcu
aliases:
    X_STEP=MCU_M7_STEP   , X_DIR=MCU_M7_DIR   , X_ENABLE=MCU_M7_EN  , X_TMCUART=MCU_M7_CS  ,
    X1_STEP=MCU_M2_STEP  , X1_DIR=MCU_M2_DIR  , X1_ENABLE=MCU_M2_EN , X1_TMCUART=MCU_M2_CS ,
    
    Y_STEP=MCU_M3_STEP   , Y_DIR=MCU_M3_DIR   , Y_ENABLE=MCU_M3_EN  , Y_TMCUART=MCU_M3_CS  ,

    Z1_STEP=MCU_M1_STEP  , Z1_DIR=MCU_M1_DIR  , Z1_ENABLE=MCU_M1_EN , Z1_TMCUART=MCU_M1_CS ,
    Z_STEP=MCU_M8_STEP   , Z_DIR=MCU_M8_DIR   , Z_ENABLE=MCU_M8_EN  , Z_TMCUART=MCU_M8_CS  ,

    # E_STEP=MCU_M7_STEP  , E_DIR=MCU_M7_DIR  , E_ENABLE=MCU_M7_EN  , E_TMCUART=MCU_M7_CS  ,

    DRIVER_SPI_MOSI=MCU_M_SPI_MOSI , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_MISO=MCU_M_SPI_MISO , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_SCK=MCU_M_SPI_SCK   , # Used in case of SPI drivers such as TMC2240 or TMC5160

    X_STOP=MCU_M1_STOP ,
    X1_STOP=MCU_M2_STOP,
    Y_STOP=MCU_M3_STOP , 
    Z_STOP=MCU_M4_STOP ,
    PROBE_INPUT=MCU_PROBE2 ,
    RUNOUT_SENSOR=MCU_FWS1 ,

    E_HEATER=MCU_HE0       , E_TEMPERATURE=MCU_TH0   ,
    BED_HEATER=MCU_BED_OUT , BED_TEMPERATURE=MCU_THB , 

    PSU_FAN=MCU_FAN0 ,
    DRIVER_FAN=MCU_FAN1 ,
    # E_FAN=MCU_FAN1 ,
    HOST_CONTROLLER_FAN=MCU_FAN2 ,
    EXHAUST_FAN=MCU_FAN3 ,
    FILTER_FAN=MCU_FAN4 ,
    # HOST_CONTROLLER_FAN=MCU_FAN5 ,

    CHAMBER_TEMPERATURE=MCU_TH1 ,
    ELECTRICAL_CABINET_TEMPERATURE=MCU_TH2 ,
    PSU_TEMPERATURE=MCU_TH3 ,

    LIGHT_OUTPUT=MCU_HE2 ,
    STATUS_NEOPIXEL=MCU_RGB1 ,
    LIGHT_NEOPIXEL=MCU_M5_STOP ,

    SERVO_PIN=MCU_PROBE1 ,


#--------------------------------------------#
#### BTT EBB36/42 v1.2 MCU definition ########
#--------------------------------------------#

[board_pins toolhead_manufacturer]
mcu: hugin
aliases:
    MCU_TMCDRIVER_STEP=PD0 , MCU_TMCDRIVER_DIR=PD1 , MCU_TMCDRIVER_ENABLE=PD2 , MCU_TMCDRIVER_UART=PA15 ,

    MCU_ENDSTOP1=PB6 , MCU_ENDSTOP2=PB5 , MCU_ENDSTOP3=PB7 ,
    MCU_PROBE=PB8 ,
    MCU_SERVOS=PB9 ,

    MCU_HOTEND0=PB13 ,
    MCU_TH0=PA3 ,

    MCU_FAN1=PA0 , MCU_FAN2=PA1 ,

    MCU_RGB=PD3 ,

    MCU_SPI1_CS=PA4  , MCU_SPI1_SCLK=PA5  , MCU_SPI1_MISO=PA6 , MCU_SPI1_MOSI=PA7  ,
    MCU_SPI2_CS=PB12 , MCU_SPI2_SCLK=PB10 , MCU_SPI2_MISO=PB2 , MCU_SPI2_MOSI=PB11 ,
# [include config/mcu_definitions/toolhead/BTT_EBB36-42_v1.2.cfg] # Do not remove this line
[board_pins ebb_mcu]
mcu: hugin
aliases:
    E_STEP=MCU_TMCDRIVER_STEP , E_DIR=MCU_TMCDRIVER_DIR , E_ENABLE=MCU_TMCDRIVER_ENABLE , E_TMCUART=MCU_TMCDRIVER_UART ,

    # X_STOP=MCU_ENDSTOP1 ,
    # Y_STOP=MCU_ENDSTOP2 ,
    PROBE_INPUT=MCU_PROBE ,
    SERVO_PIN=MCU_SERVOS ,
    TOOLHEAD_SENSOR=MCU_ENDSTOP3 ,

    E_HEATER=MCU_HOTEND0 ,
    E_TEMPERATURE=MCU_TH0 ,

    PART_FAN=MCU_FAN1 ,
    E_FAN=MCU_FAN2 ,

    STATUS_NEOPIXEL=MCU_RGB ,

    ADXL_CS=MCU_SPI2_CS , ADXL_SCLK=MCU_SPI2_SCLK , ADXL_MISO=MCU_SPI2_MISO , ADXL_MOSI=MCU_SPI2_MOSI ,



