[gcode_macro _USER_VARIABLES]
variable_x_driver: "tmc2209"
variable_x1_driver: "tmc2209"
gcode:

[tmc2209 stepper_x]
uart_pin: X_TMCUART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_x]
position_min: -38
position_endstop: -34
position_max: 211

rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

homing_speed: 80
homing_retract_dist: 0

step_pin: X_STEP
dir_pin: X_DIR
enable_pin: !X_ENABLE
endstop_pin: ^hugin:X_STOP

[dual_carriage]
axis: x
step_pin: X1_STEP
dir_pin: !X1_DIR
enable_pin: !X1_ENABLE
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^munin:X_STOP

position_endstop: 267
position_max: 271
position_min: 20
homing_speed: 80
# A minimum distance between the carriages to enforce
safe_distance: 40

[tmc2209 dual_carriage]
uart_pin: X1_TMCUART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

