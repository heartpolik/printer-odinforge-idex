[gcode_macro _USER_VARIABLES]
variable_x_driver: "tmc2209"
# variable_x1_driver: "tmc2209"
gcode:

[tmc2209 stepper_x]
uart_pin: X_TMCUART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# Unmarked motor salvaged from an Anycubic Kobra Go (42-34 short NEMA17 frame).
# resistance/inductance measured directly (LCR meter @ 1kHz, 2026-07-20): L=5.227mH, R=5.897ohm.
# holding_torque/max_current not measured (no way to test stall torque here) - kept at the
# klipper_tmc_autotune "creality-42-34" reference values (same 42-34 frame class) as an estimate.
[motor_constants kobra_go_x_measured]
resistance: 5.897
inductance: 0.005227
holding_torque: 0.4
max_current: 1.0
steps_per_revolution: 200

[autotune_tmc stepper_x]
motor: kobra_go_x_measured

[stepper_x]
position_min: -38
position_endstop: -34
position_max: 222

rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

homing_speed: 80
homing_retract_dist: 0

step_pin: X_STEP
dir_pin: X_DIR
enable_pin: !X_ENABLE
endstop_pin: X_STOP

[dual_carriage]
axis: x
step_pin: X1_STEP
dir_pin: !X1_DIR
enable_pin: !X1_ENABLE
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^X1_STOP

position_endstop: 267
position_max: 271
position_min: 26  # measured 2026-07-23; print-zone (bed) edge for this carriage is ~231.6
homing_speed: 80
# A minimum distance between the carriages to enforce
safe_distance: 40

[tmc2209 dual_carriage]
uart_pin: X1_TMCUART
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

