[controller_fan drivers_fan]
pin: DRIVER_FAN
max_power: 0.6
#fan_speed: 1.0
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when a heater or stepper driver is active.
#   The default is 1.0
#idle_timeout:
#   The amount of time (in seconds) after a stepper driver or heater
#   was active and the fan should be kept running. The default
#   is 30 seconds.
#idle_speed:
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when a heater or stepper driver was active and
#   before the idle_timeout is reached. The default is fan_speed.
#heater:
# stepper: 
#   Name of the config section defining the heater/stepper that this fan
#   is associated with. If a comma separated list of heater/stepper names
#   is provided here, then the fan will be enabled when any of the given
#   heaters/steppers are enabled. The default heater is "extruder", the
#   default stepper is all of them.

[temperature_fan PSU_fan]
pin: PSU_FAN
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PSU_TEMPERATURE
control: watermark
min_temp: 10
max_temp: 80

[gcode_macro M106]
description: part fan control for idex IDEX
# rename_existing: M106.1
variable_last_speed: 0
variable_default_speed: 0   # 0..255 значення швидкості вентилятора за замовчуванням
variable_swap_speed: 0
gcode:
  # Вибір швидкості: спершу S, далі остання збережена, інакше дефолт
  {% set s_in = params.S if 'S' in params else None %}
  {% set s0 = s_in|int if s_in is not none else printer["gcode_macro M106"].last_speed|int %}
  {% set s = s0 if s0 != 0 else printer["gcode_macro M106"].default_speed|int %}
  {% set s = [[s|int, 255]|min, 0]|max %}
  SET_GCODE_VARIABLE MACRO=M106 VARIABLE=last_speed VALUE={s}
  {% set speed = s / 255|float %}

  # Opt into fan speed swop control
  # если переключаемые головы, то каждая управляется отдельно:
  {% if printer.dual_carriage.carriage_1 == "INACTIVE" or printer.dual_carriage.carriage_1 == "PRIMARY" %}
    {% if printer.toolhead.extruder == "extruder" %}
      SET_FAN_SPEED FAN=hugin_part_fan SPEED={speed}
    {% else %}
      SET_FAN_SPEED FAN=munin_part_fan SPEED={speed}
    {% endif %}
    # противоположная выключается
    {% if printer.toolhead.extruder == "extruder1" %}
      SET_FAN_SPEED FAN=hugin_part_fan  SPEED=0
    {% else %}
      SET_FAN_SPEED FAN=munin_part_fan SPEED=0
    {% endif %}
  # если зависмые головы (копия, зеркало) вертиляторы работают синхронно:
  {% else %}
    SET_FAN_SPEED FAN=hugin_part_fan SPEED={speed}
    SET_FAN_SPEED FAN=munin_part_fan SPEED={speed}
  {% endif %}

[gcode_macro M107]
description:
#rename_existing: M107.1
gcode:
  M106 S0
  #SET_FAN_SPEED FAN=PartFAN_extruder  SPEED=0
