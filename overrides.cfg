############################################# \
######## USER CONFIG OVERRIDES FILE #########  + --> This will help you personalize my config to your printer :)
############################################# /

# This file is yours! Feel free to edit it in order to include all the needed
# things to adapt my generic config to your machine. This file will not be erased
# when updating the config using moonraker and it will be kept as you've set it.
# You can change every section of the config. You can also add some new custom macros, etc...
# The corresponding documentation can be found in: docs > overrides.md

### Also, keep in mind: if you use a multi-MCU config such as the old school double SKRs or a CANbus toolhead
### board, you will need to specify which components are connected to which board in your own mcu.cfg file!
### Example: if something is connected to the toolhead MCU, you should use "config_pin: toolhead:PIN_NAME".

#> Main control MCUs are called "mcu" (and "secondary" when using a double MCU configuration)
#> Toolhead CANboard MCUs are called "toolhead"
#> MMU/ERCF MCUs are called "mmu" 

# ------------------------------------------------------------------------------------------

[printer]
max_velocity: 450
max_accel: 1000

[auto_speed]

[gcode_macro NOZZLE_OFFSETS]
description: 'Порівнює висоти двох екструдерів за допомогою Z-проби'
gcode:
    {% set probe_x = 28 %}
    {% set probe_y = 236 %}
    {% set lift_z = 15 %}

    G90
    G0 Z{lift_z}

    M117 "Проба Z для екструдера T0"
    T0
    G0 X{probe_x} Y{probe_y} F6000
    G28 Z
    {% set z0 = printer.toolhead.position.z %}

    G0 Z{lift_z}

    M117 "Проба Z для екструдера T1"
    T1
    G0 X{probe_x} Y{probe_y} F6000
    G28 Z
    {% set z1 = printer.toolhead.position.z %}

    {% set diff = z1 - z0 %}
    {% set msg = "Різниця між T1 і T0: %.3f мм" % diff %}
    M117 {msg}
    RESPOND PREFIX="Z-OFFSET" MSG="{msg}"

[gcode_macro PARK_extruder]
gcode:
    SAVE_GCODE_STATE NAME=park0
    PARK_hugin
    RESTORE_GCODE_STATE NAME=park0

[gcode_macro PARK_extruder1]
gcode:
    SAVE_GCODE_STATE NAME=park1
    PARK_munin
    RESTORE_GCODE_STATE NAME=park1





[force_move]
enable_force_move: true




#-------------------------#
#   START_PRINT SEQUENCE  #
#-------------------------#

## The START_PRINT sequence is modular and fully customizable. A default START_PRINT sequence is auto-populated based on
## your probe choice (TAP, Dockable, Inductive), but if for some reasons you still want to modify it, please uncomment the following 3
## lines to define a new `variable_startprint_actions`. You can use any number of action or even duplicate some actions if needed.
## Available actions: "bed_soak", "extruder_preheating", "chamber_soak", "extruder_heating", "tilt_calib", "z_offset", "bedmesh", "purge", "clean", "primeline"
##
[gcode_macro _USER_VARIABLES]
variable_startprint_actions: "bed_soak", "extruder_preheating", "chamber_soak", "tilt_calib", "extruder_heating", "purge", "clean", "z_offset", "custom1", "bedmesh", "custom2", "extruder_heating", "primeline"
gcode: # do not remove this line

[gcode_macro _MODULE_CUSTOM1]
gcode:
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}
    {% if INITIAL_TOOL == 1 %}
        T1
    {% else %}
        T0
    {% endif %}
    {% set IDEX_MODE = params.IDEX_MODE|default("primary")|string %} # 
    {% if IDEX_MODE == "primary" %}
        IDEX_PRIMARY_MODE
    {% elif IDEX_MODE == "mirror" %}
        IDEX_MIRROR_MODE
    {% elif IDEX_MODE == "copy" %}
        IDEX_COPY_MODE
    {% endif %}

[gcode_macro _MODULE_CUSTOM2]
gcode:
    {% set EXTRUDER_TEMP = printer["gcode_macro START_PRINT"].extruder_temp|float %}
    {% if printer["dual_carriage"].carriage_1 in ["COPY", "MIRROR"] %}
        M104 T1 S{EXTRUDER_TEMP}
        M109 T1 S{EXTRUDER_TEMP}
    {% endif %}
    # ---- CUSTOM Macro section
    # this section is reserved for personal customized start actions, which can be combined with all other start actions
    # in order to use this, create a new macro in overrides.cfg
    # [gcode_macro _MODULE_CUSTOM1]
    # gcode:
    #   ## Your custom code here

[gcode_macro _CONDITIONAL_MOVE_TO_PURGE_BUCKET]
gcode:
    {% set purge_and_brush_enabled = printer["gcode_macro _USER_VARIABLES"].purge_and_brush_enabled %}
    {% if not purge_and_brush_enabled %}
        {% if printer.toolhead.extruder == 'extruder' %}
            _PARK_extruder
        {% else %}
            _PARK_extruder1
        {% endif %}
    {% endif %}

#-------------------------#
#   LED EFFECTS (IDEX)    #
#-------------------------#

[gcode_macro LED_HUGIN_FAST_ON]
description: Fast flashing red effect for Hugin (red head)
variable_running: 0
variable_phase: 0
gcode:
    SET_GCODE_VARIABLE MACRO=LED_HUGIN_FAST_ON VARIABLE=running VALUE=1
    UPDATE_DELAYED_GCODE ID=_LED_HUGIN_TICK DURATION=0.08

[gcode_macro LED_HUGIN_OFF]
gcode:
    SET_GCODE_VARIABLE MACRO=LED_HUGIN_FAST_ON VARIABLE=running VALUE=0
    SET_LED LED=hugin_leds RED=0 GREEN=0 BLUE=0 TRANSMIT=1

[delayed_gcode _LED_HUGIN_TICK]
initial_duration: 0
gcode:
    {% if printer["gcode_macro LED_HUGIN_FAST_ON"].running %}
        {% set ph = printer["gcode_macro LED_HUGIN_FAST_ON"].phase|int %}
        {% set bright = 1.0 if (ph % 2) == 0 else 0.1 %}
        SET_LED LED=hugin_leds RED={bright} GREEN=0 BLUE=0 TRANSMIT=1
        SET_GCODE_VARIABLE MACRO=LED_HUGIN_FAST_ON VARIABLE=phase VALUE={(ph + 1) % 2}
        UPDATE_DELAYED_GCODE ID=_LED_HUGIN_TICK DURATION=0.08
    {% endif %}

[gcode_macro LED_MUNIN_SMOOTH_ON]
description: Smooth breathing blue effect for Munin (blue head)
variable_running: 0
variable_val: 0.1
variable_dir: 1
gcode:
    SET_GCODE_VARIABLE MACRO=LED_MUNIN_SMOOTH_ON VARIABLE=running VALUE=1
    UPDATE_DELAYED_GCODE ID=_LED_MUNIN_TICK DURATION=0.25

[gcode_macro LED_MUNIN_OFF]
gcode:
    SET_GCODE_VARIABLE MACRO=LED_MUNIN_SMOOTH_ON VARIABLE=running VALUE=0
    SET_LED LED=munin_leds RED=0 GREEN=0 BLUE=0 TRANSMIT=1

[delayed_gcode _LED_MUNIN_TICK]
initial_duration: 0
gcode:
    {% if printer["gcode_macro LED_MUNIN_SMOOTH_ON"].running %}
        {% set val = printer["gcode_macro LED_MUNIN_SMOOTH_ON"].val|float %}
        {% set dir = printer["gcode_macro LED_MUNIN_SMOOTH_ON"].dir|int %}
        {% set step = 0.05 %}
        {% set next = val + dir * step %}
        {% if next >= 1.0 %}
            {% set next = 1.0 %}
            {% set dir = -1 %}
        {% elif next <= 0.1 %}
            {% set next = 0.1 %}
            {% set dir = 1 %}
        {% endif %}
        SET_LED LED=munin_leds RED=0 GREEN=0 BLUE={next} TRANSMIT=1
        SET_GCODE_VARIABLE MACRO=LED_MUNIN_SMOOTH_ON VARIABLE=val VALUE={next}
        SET_GCODE_VARIABLE MACRO=LED_MUNIN_SMOOTH_ON VARIABLE=dir VALUE={dir}
        UPDATE_DELAYED_GCODE ID=_LED_MUNIN_TICK DURATION=0.25
    {% endif %}


#-------------------------#
#   END PRINT             #
#-------------------------#
[gcode_macro END_PRINT]
description: End of print - cool down, park, stop effects
gcode:
    # Stop LED effects so they don't continue after print
    LED_HUGIN_OFF
    LED_MUNIN_OFF

    # User configurable safe end actions
    M400
    G92 E0
    G1 E-2 F2400
    G90
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 Z{printer.toolhead.position.z + 10} F6000
        G1 X0 Y0 F9000
    {% endif %}
    M104 S0
    M140 S0
    M106 S0
    M84

