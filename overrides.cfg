
# ==== Y-axis bed accelerometer (BTT ADXL345 V2.0.1, TEMPORARY, physically unplugged most of the time) ====
# Uncomment the include below ONLY while the accelerometer is wired to the bed for a shaper
# calibration session, then FIRMWARE_RESTART. Comment it out again (and FIRMWARE_RESTART) before
# printing/homing without it — with this on and the chip unplugged, Klipper fails to start.
# [include accel_bed_ytest.cfg]

# AUTO SPEED found recommended acceleration and velocity after 208.16s
# | X max: a39574 v1380
# | Y max: a11730 v374
# Recommended accel: 11730
# Recommended velocity: 374

[printer]
# AUTO_SPEED result (2026-07-20): raw max X=1725/Y=862 accel=97937,
# recommended (with safety margin) below.
max_velocity: 690
max_accel: 15000

[auto_speed]



[force_move]
enable_force_move: true

[filament_switch_sensor runout_sensor]
switch_pin: ^hugin:TOOLHEAD_SENSOR


# [gcode_macro _USER_VARIABLES]
# variable_startprint_actions: "bed_soak", "extruder_preheating", "chamber_soak", "tilt_calib", "extruder_heating", "purge", "clean", "z_offset", "bedmesh", "set_mode", "pre_print_purge"

[gcode_macro _USER_VARIABLES]
variable_probe_type_enabled: "bltouch"
variable_startprint_actions: "idex_reset", "bed_soak", "extruder_preheating", "chamber_soak", "tilt_calib", "extruder_heating", "z_offset", "bedmesh", "idex_initial_tool", "primeline"
# idex_reset / idex_initial_tool: see _START_PRINT_ACTION_IDEX_* in idex.cfg. Probing (z_offset, bedmesh)
# must run on T0 (probe is on hugin), so the initial tool is selected only right before the primeline.
# "clean" and "purge" temporarily removed: brush (X=-21) and purge bucket (X=-32) are both close
# to position_min=-38, and the Micro Probe V2's x_offset=-28.45 means the probe body may swing
# past the left frame at those X positions.
# purge_and_brush_enabled is also disabled below since extruder_heating unconditionally calls
# _CONDITIONAL_MOVE_TO_PURGE_BUCKET regardless of the "purge" stage; disabling it makes
# extruder_heating heat at bed center instead. Re-enable once mechanical clearance is confirmed.
variable_purge_and_brush_enabled: False
gcode:

# Параметри ретракту/unretract для парковки інструментів (E3D V6)
variable_park_retract_length: 4.5      # Довжина ретракту при парковці (мм) - для E3D V6 теплова зона 4-5 мм
variable_park_retract_speed: 35        # Швидкість ретракту при парковці (мм/с)
variable_park_retract_zhop: 0.3        # Підйом сопла при ретракті (мм)
variable_park_retract_wipe: 2          # Відстань для wipe-руху при ретракті (мм)
variable_park_unretract_length: 5.0    # Довжина unretract при активації (мм) - трохи більше ніж ретракт
variable_park_unretract_speed: 25      # Швидкість unretract при активації (мм/с)
variable_park_unretract_prime: 1.0      # Додатковий prime для тиску після unretract (мм)

# Параметри pre-print purge (замість primeline)
variable_pre_print_purge_length: 15     # Довжина purge перед початком друку (мм)
variable_pre_print_purge_speed: 300     # Швидкість purge перед початком друку (мм/хв)
variable_pre_print_purge_z: 5           # Висота Z для purge перед початком друку (мм)

gcode: # do not remove this line

[skew_correction] 

[gcode_macro _USER_VARIABLES]
variable_status_leds_logo_idx: '3'
variable_status_leds_nozzle_idx: '1,2'
gcode:

[neopixel status_leds]
pin: hugin:STATUS_NEOPIXEL

# Override of macros/base/homing/homing_override.cfg (Klippain framework file, do not edit directly).
# Original Z-homing moves the NOZZLE to bed_mesh's zero_reference_position before G28 Z0, so the
# PROBE (offset from nozzle by [probe] x_offset/y_offset) ends up touching off-center instead.
# Fix: shift the nozzle target by the probe offset so the PROBE lands on zero_reference_position.
[homing_override]
axes: xyz
gcode:
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}
    {% set kinematics = printer["configfile"].config["printer"]["kinematics"] %}
    {% set probe_type_enabled = printer["gcode_macro _USER_VARIABLES"].probe_type_enabled %}
    {% set homing_zhop = printer["gcode_macro _USER_VARIABLES"].homing_zhop|float|abs %}
    {% set homing_travel_speed = printer["gcode_macro _USER_VARIABLES"].homing_travel_speed * 60 %}
    {% set homing_travel_accel = printer["gcode_macro _USER_VARIABLES"].homing_travel_accel %}
    {% set sensorless_homing_enabled = printer["gcode_macro _USER_VARIABLES"].sensorless_homing_enabled %}
    {% set sensorless_current_factor = printer["gcode_macro _USER_VARIABLES"].sensorless_current_factor / 100 %}
    {% set x_driver = printer["gcode_macro _USER_VARIABLES"].x_driver %}
    {% set y_driver = printer["gcode_macro _USER_VARIABLES"].y_driver %}
    {% set z_driver = printer["gcode_macro _USER_VARIABLES"].z_driver %}
    {% set z_drop_speed = printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60 %}
    {% set status_leds_enabled = printer["gcode_macro _USER_VARIABLES"].status_leds_enabled %}
    {% set bed_mesh_enabled = printer["gcode_macro _USER_VARIABLES"].bed_mesh_enabled %}

    {% set homing_first = printer["gcode_macro _USER_VARIABLES"].homing_first|string|upper %}
    {% set x_homing_backoff, y_homing_backoff = printer["gcode_macro _USER_VARIABLES"].homing_backoff_distance_xy|map('float') %}

    {% set x_position_endstop = printer["configfile"].config["stepper_x"]["position_endstop"]|float %}
    {% set y_position_endstop = printer["configfile"].config["stepper_y"]["position_endstop"]|float %}
    {% set x_position_center = printer.toolhead.axis_maximum.x|int/2 - printer.toolhead.axis_minimum.x|int/2 %}
    {% set y_position_center = printer.toolhead.axis_maximum.y|int/2 - printer.toolhead.axis_minimum.y|int/2 %}


    {% if probe_type_enabled == "dockable" or probe_type_enabled == "dockable_virtual" %}
        _CHECK_PROBE action=query
    {% endif %}

    # reset parameters
    {% set X, Y, Z = False, False, False %}

    {% if status_leds_enabled %}
        STATUS_LEDS COLOR="HOMING"
    {% endif %}

    # which axes have been requested for homing
    {% if not 'X' in params
        and not 'Y' in params
        and not 'Z' in params %}

        {% set X, Y, Z = True, True, True %}

    {% else %}
        {% if 'X' in params %}
            {% set X = True %}
        {% endif %}

        {% if 'Y' in params %}
            {% set Y = True %}
        {% endif %}

        {% if 'Z' in params %}
            {% set Z = True %}
        {% endif %}

        {% if 'X' in params
          and 'Y' in params
          and 'Z' in params %}
            # reset homing state variables
            # if homing all axes
            _HOMING_VARIABLES reset=1
         {% endif %}

    {% endif %}

    {% if probe_type_enabled == "dockable" or probe_type_enabled == "dockable_virtual" %}
       _ENTRY_POINT FUNCTION=homing_override
    {% endif %}

    # Set the homing acceleration prior to any movement
    {% set saved_accel = printer.toolhead.max_accel %}
    M204 S{homing_travel_accel}

    {% if bed_mesh_enabled %}
        BED_MESH_CLEAR
    {% endif %}

    G90

    {% if Z %}
        {% if ('z' in printer.toolhead.homed_axes) %}
            {% if (printer.toolhead.position.z < homing_zhop) %}
                {% if verbose %}
                    { action_respond_info("Z too low, performing ZHOP to rehome Z") }
                {% endif %}
                G91
                G0 Z{homing_zhop} F{z_drop_speed}
                M400
                G90
            {% else %}
                {% if verbose %}
                    { action_respond_info("Z already safe, no ZHOP needed to rehome Z") }
                {% endif %}
            {% endif %}
        {% elif ('xy' in printer.toolhead.homed_axes) %}
            {% if verbose %}
                { action_respond_info("X and Y already homed, no ZHOP needed to home Z") }
            {% endif %}
        {% else %}
            {% if verbose %}
                { action_respond_info("X and Y not homed, forcing full G28 to home Z properly") }
            {% endif %}
            SET_KINEMATIC_POSITION X=0 Y=0 Z=0
            G0 Z{homing_zhop} F{z_drop_speed}
            {% if sensorless_homing_enabled and kinematics == "corexz" %}
                # Wait for stallguard registers to clear
                M400
            {% endif %}
            {% set X, Y, Z = True, True, True %}
        {% endif %}
    {% endif %}

    {% if homing_first == "X" %}
        {% if X %} # Home x
            {% if verbose %}
                { action_respond_info("Homing X") }
            {% endif %}
            {% if sensorless_homing_enabled %}
                {% if kinematics == "corexy" %}
                    {% set old_current_x = printer.configfile.config[x_driver ~ ' stepper_x'].run_current|float %}
                    {% set old_current_y = printer.configfile.config[y_driver ~ ' stepper_y'].run_current|float %}
                    {% set new_current_x = sensorless_current_factor * old_current_x %}
                    {% set new_current_y = sensorless_current_factor * old_current_y %}
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_current_y}
                    M400
                {% elif kinematics == "corexz" %}
                    {% set old_current_x = printer.configfile.config[x_driver ~ ' stepper_x'].run_current|float %}
                    {% set old_current_z = printer.configfile.config[z_driver ~ ' stepper_z'].run_current|float %}
                    {% set new_current_x = sensorless_current_factor * old_current_x %}
                    {% set new_current_z = sensorless_current_factor * old_current_z %}
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={new_current_z}
                    M400
                {% elif kinematics == "cartesian" %}
                    {% set old_current_x = printer.configfile.config[x_driver ~ ' stepper_x'].run_current|float %}
                    {% set new_current_x = sensorless_current_factor * old_current_x %}
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_current_x}
                    M400
                {% endif %}
            {% endif %}
            G28 X0
            G1 X{x_position_endstop + x_homing_backoff} F{homing_travel_speed}
            {% if sensorless_homing_enabled %}
                {% if kinematics == "corexy" %}
                    M400
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={old_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={old_current_y}
                {% elif kinematics == "corexz" %}
                    M400
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={old_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={old_current_z}
                {% elif kinematics == "cartesian" %}
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={old_current_x}
                {% endif %}
            {% endif %}
        {% endif %}
        {% if Y %} # Home y
            {% if verbose %}
                { action_respond_info("Homing Y") }
            {% endif %}
            {% if sensorless_homing_enabled %}
                {% if kinematics == "corexy" %}
                    {% set old_current_x = printer.configfile.config[x_driver ~ ' stepper_x'].run_current|float %}
                    {% set old_current_y = printer.configfile.config[y_driver ~ ' stepper_y'].run_current|float %}
                    {% set new_current_x = sensorless_current_factor * old_current_x %}
                    {% set new_current_y = sensorless_current_factor * old_current_y %}
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_current_y}
                    M400
                {% elif kinematics == "corexz" %}
                    {% set old_current_y = printer.configfile.config[y_driver ~ ' stepper_y'].run_current|float %}
                    {% set new_current_y = sensorless_current_factor * old_current_y %}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_current_y}
                    M400
                {% elif kinematics == "cartesian" %}
                    {% set old_current_y = printer.configfile.config[y_driver ~ ' stepper_y'].run_current|float %}
                    {% set new_current_y = sensorless_current_factor * old_current_y %}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_current_y}
                    M400
                {% endif %}
            {% endif %}
            G28 Y0
            G1 Y{y_position_endstop + y_homing_backoff} F{homing_travel_speed}
            {% if sensorless_homing_enabled %}
                {% if kinematics == "corexy" %}
                    M400
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={old_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={old_current_y}
                {% elif kinematics == "corexz" %}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={old_current_y}
                {% elif kinematics == "cartesian" %}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={old_current_y}
                {% endif %}
            {% endif %}
        {% endif %}

    {% elif homing_first == "Y" %}
        {% if Y %} # Home y
            {% if verbose %}
                { action_respond_info("Homing Y") }
            {% endif %}
            {% if sensorless_homing_enabled %}
                {% if kinematics == "corexy" %}
                    {% set old_current_x = printer.configfile.config[x_driver ~ ' stepper_x'].run_current|float %}
                    {% set old_current_y = printer.configfile.config[y_driver ~ ' stepper_y'].run_current|float %}
                    {% set new_current_x = sensorless_current_factor * old_current_x %}
                    {% set new_current_y = sensorless_current_factor * old_current_y %}
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_current_y}
                    M400
                {% elif kinematics == "corexz" %}
                    {% set old_current_y = printer.configfile.config[y_driver ~ ' stepper_y'].run_current|float %}
                    {% set new_current_y = sensorless_current_factor * old_current_y %}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_current_y}
                    M400
                {% elif kinematics == "cartesian" %}
                    {% set old_current_y = printer.configfile.config[y_driver ~ ' stepper_y'].run_current|float %}
                    {% set new_current_y = sensorless_current_factor * old_current_y %}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_current_y}
                    M400
                {% endif %}
            {% endif %}
            G28 Y0
            G1 Y{y_position_endstop + y_homing_backoff} F{homing_travel_speed}
            {% if sensorless_homing_enabled %}
                {% if kinematics == "corexy" %}
                    M400
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={old_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={old_current_y}
                {% elif kinematics == "corexz" %}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={old_current_y}
                {% elif kinematics == "cartesian" %}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={old_current_y}
                {% endif %}
            {% endif %}
        {% endif %}
        {% if X %} # Home x
            {% if verbose %}
                { action_respond_info("Homing X") }
            {% endif %}
            {% if sensorless_homing_enabled %}
                {% if kinematics == "corexy" %}
                    {% set old_current_x = printer.configfile.config[x_driver ~ ' stepper_x'].run_current|float %}
                    {% set old_current_y = printer.configfile.config[y_driver ~ ' stepper_y'].run_current|float %}
                    {% set new_current_x = sensorless_current_factor * old_current_x %}
                    {% set new_current_y = sensorless_current_factor * old_current_y %}
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_current_y}
                    M400
                {% elif kinematics == "corexz" %}
                    {% set old_current_x = printer.configfile.config[x_driver ~ ' stepper_x'].run_current|float %}
                    {% set old_current_z = printer.configfile.config[z_driver ~ ' stepper_z'].run_current|float %}
                    {% set new_current_x = sensorless_current_factor * old_current_x %}
                    {% set new_current_z = sensorless_current_factor * old_current_z %}
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={new_current_z}
                    M400
                {% elif kinematics == "cartesian" %}
                    {% set old_current_x = printer.configfile.config[x_driver ~ ' stepper_x'].run_current|float %}
                    {% set new_current_x = sensorless_current_factor * old_current_x %}
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_current_x}
                    M400
                {% endif %}
            {% endif %}
            G28 X0
            G1 X{x_position_endstop + x_homing_backoff} F{homing_travel_speed}
            {% if sensorless_homing_enabled %}
                {% if kinematics == "corexy" %}
                    M400
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={old_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={old_current_y}
                {% elif kinematics == "corexz" %}
                    M400
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={old_current_x}
                    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={old_current_z}
                {% elif kinematics == "cartesian" %}
                    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={old_current_x}
                {% endif %}
            {% endif %}
        {% endif %}

    {% else %}
        { action_respond_error("Axis homing order not valid. Choose either X or Y first in the variables.cfg file!") }
    {% endif %}


    # Home z
    {% if Z %}
        {% if verbose %}
            { action_respond_info("Homing Z") }
        {% endif %}

        # If there is a virtual probe endstop (ie. TAP or inductive as virtual), we go to the center of the bed
        # If the Z endstop is not virtual, then we just move to it
        {% if printer["configfile"].config["stepper_z"]["endstop_pin"]|lower == "probe:z_virtual_endstop" %}
            # If our virtual endstop is a dockable probe, we need to activate it first
            # If it's the voron tap, we put it to a safe temperature
            {% if probe_type_enabled == "dockable_virtual" or probe_type_enabled == "vorontap" %}
                ACTIVATE_PROBE
            {% endif %}

            # Compensate for the probe XY offset so that the PROBE (not the nozzle) ends up
            # at the target position: G0 moves the nozzle, so we shift back by the probe offset.
            {% set probe_x_offset = printer["configfile"].config["probe"]["x_offset"]|default(0)|float %}
            {% set probe_y_offset = printer["configfile"].config["probe"]["y_offset"]|default(0)|float %}

            # If there is a bed_mesh enabled and a zero_reference_position set, we retrieve it to home on it
            # Else, we default to the center of the bed
            {% if not bed_mesh_enabled or not printer["configfile"].config["bed_mesh"]["zero_reference_position"] %}
                G0 X{x_position_center - probe_x_offset} Y{y_position_center - probe_y_offset} F{homing_travel_speed}
            {% else %}
                {% set ZRPx, ZRPy = printer["configfile"].config["bed_mesh"]["zero_reference_position"].split(',')|map('trim')|map('float') %}
                G0 X{ZRPx - probe_x_offset} Y{ZRPy - probe_y_offset} F{homing_travel_speed}
            {% endif %}

        # Else, go to the Z endstop physical pin
        {% else %}
            _GOTO_Z_PROBE
        {% endif %}

        G28 Z0

        G91
        {% if printer["configfile"].settings["stepper_z"]["homing_positive_dir"] == False %}
            G0 Z{homing_zhop} F{z_drop_speed} # small Z hop to avoid grinding the bed (as we should be close to Z0 right now)
        {% elif printer["configfile"].settings["stepper_z"]["homing_positive_dir"] == True %}
            G0 Z-{homing_zhop} F{z_drop_speed} # small Z move in the opposite direction to avoid staying on the endstop (not dangerous since we should be at Z max)
        {% endif %}
        G90

        # if voron tap, restore original temperature
        # if dockable probe as virtual endstop, then dock the probe
        {% if probe_type_enabled == "vorontap" or probe_type_enabled == "dockable_virtual" %}
            DEACTIVATE_PROBE
        {% endif %}
    {% endif %}

    {% if probe_type_enabled == "dockable" or probe_type_enabled == "dockable_virtual" %}
        _CHECK_PROBE action=query
    {% endif %}

    # Reset acceleration values to what it was before
    SET_VELOCITY_LIMIT ACCEL={saved_accel}

    {% if probe_type_enabled == "dockable" or probe_type_enabled == "dockable_virtual" %}
        _EXIT_POINT FUNCTION=homing_override
    {% endif %}

    {% if status_leds_enabled %}
        STATUS_LEDS COLOR="READY"
    {% endif %}

#-------------------------------------------------------------------------------------------#
# Override of macros/base/start_print.cfg's _MODULE_EXTRUDER_HEATING (Klippain framework
# file, do not edit directly). Stock version only heats whichever extruder is already
# active. IDEX addition: also preheat the OTHER toolhead's nozzle to extruder_temp1 (set via
# SET_GCODE_VARIABLE from the slicer's start g-code before calling START_PRINT - see
# orca_start_gcode.txt) so a mid-print T0<->T1 switch doesn't have to wait on a cold nozzle.
# Uses M109 T<n> (not T0/T1) so no carriage parking motion happens here - heating doesn't need
# the carriage to move. Heats INITIAL_TOOL's nozzle even though T0 is still active for probing.
#-------------------------------------------------------------------------------------------#
[gcode_macro _MODULE_EXTRUDER_HEATING]
variable_extruder_temp1: 0
gcode:
    # ----- EXTRUDER HEATING ---------------------------------
    # Heat the nozzle to print temperature ontop of the purge bucket (if available) or in the middle of the bed
    {% set EXTRUDER_TEMP = printer["gcode_macro START_PRINT"].extruder_temp %}
    {% set INITIAL_TOOL = printer["gcode_macro START_PRINT"].initial_tool %}
    {% set EXTRUDER_TEMP1 = printer["gcode_macro _MODULE_EXTRUDER_HEATING"].extruder_temp1 %}

    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}
    {% set status_leds_control_enabled = printer["gcode_macro _USER_VARIABLES"].status_leds_control_enabled|default(False) %}
    {% set klippain_mmu_enabled = printer["gcode_macro _USER_VARIABLES"].klippain_mmu_enabled %}
    {% set purge_and_brush_enabled = printer["gcode_macro _USER_VARIABLES"].purge_and_brush_enabled %}
    {% set purgeclean_servo_enabled = printer["gcode_macro _USER_VARIABLES"].purgeclean_servo_enabled %}

    {% set St = printer["gcode_macro _USER_VARIABLES"].travel_speed * 60 %}
    {% set Px, Py, Pz = printer["gcode_macro _USER_VARIABLES"].purge_bucket_xyz|map('float') %}

    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}

    {% if status_leds_control_enabled %}
        STATUS_LEDS COLOR="HEATING"
    {% endif %}

    {% if verbose %}
        RESPOND MSG="Extruder heating to print temperature..."
    {% endif %}

    _CONDITIONAL_MOVE_TO_PURGE_BUCKET
    {% if not purge_and_brush_enabled %}
        G0 X{max_x|int / 2} Y{max_y|int / 3} Z50 F{St}
    {% endif %}

    # IDEX: heat the initial tool's nozzle (T0 is still the active tool here, probing happens on it),
    # then preheat the other nozzle if the print uses it, or make sure it is off if it doesn't
    # (_MODULE_EXTRUDER_PREHEATING may have warmed the active one). M109 T<n> targets a heater
    # without activating its extruder, so no carriage moves.
    {% set OTHER_TOOL = 1 - INITIAL_TOOL %}
    M109 T{INITIAL_TOOL} S{EXTRUDER_TEMP}
    {% if EXTRUDER_TEMP1 > 0 %}
        M109 T{OTHER_TOOL} S{EXTRUDER_TEMP1}
    {% else %}
        M104 T{OTHER_TOOL} S0
    {% endif %}

    # Load intial tool into MMU (if needed)
    {% if klippain_mmu_enabled %}
        _KLIPPAIN_MMU_LOAD_INITIAL_TOOL
    {% endif %}

    {% if purgeclean_servo_enabled %}
        _SERVO_RETRACT ITEM="purge"
    {% endif %}

    {% if verbose %}
        RESPOND MSG="Extruder temperature OK"
    {% endif %}
