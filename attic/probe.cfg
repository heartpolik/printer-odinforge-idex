[probe]
x_offset: 18
y_offset: 16
z_offset: 10
speed: 8
lift_speed: 15
samples: 2
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.01
samples_tolerance_retries: 3

[gcode_macro _USER_VARIABLES]
variable_zcalib_plugin_enabled: True
gcode:

# Automatically include the associated CALIBRATE_Z overide
[include ./macros/base/homing/z_calibration.cfg]

[z_calibration]
speed: 200 # X,Y movements
nozzle_xy_position:   28, 236
# nozzle_xy_position:   printer["gcode_macro _USER_VARIABLES"].endstop_xy_position
switch_xy_offsets:    -12.6, -16
bed_xy_position: 20, 20
#bed_xy_position:      <X,Y position for probing the bed, for instance the center point - not needed if mesh with zero_reference_position is used>
switch_offset:  0.46

offset_margins: -8, 1.5
samples: 3

probing_first_fast: true
before_switch_gcode: _ATTACH_PROBE
end_gcode: SPECIAL_DEATCH


[gcode_macro SPECIAL_DEATCH]
  gcode:
       SAVE_GCODE_STATE NAME=special_detach
       SET_GCODE_OFFSET Z=0.0
        
        _DOCK_PROBE
        
       RESTORE_GCODE_STATE NAME=special_detach

[gcode_macro _ATTACH_PROBE]
description: Attaches probe
gcode:
    # Get probe attach status
    {% set probe_attached = printer["gcode_macro _PROBE_VARIABLES"].probe_attached %}
    {% set probe_lock = printer["gcode_macro _PROBE_VARIABLES"].probe_lock %}
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}

    # Get Docking location
    {% set probe_dock_location_x, probe_dock_location_y, probe_dock_location_z = printer["gcode_macro _USER_VARIABLES"].probe_dock_location_xyz|map('float') %}

    {% set probe_before_attach_position = printer["gcode_macro _USER_VARIABLES"].probe_before_attach_position|string %}
    {% set probe_after_attach_position = printer["gcode_macro _USER_VARIABLES"].probe_after_attach_position|string %}
    {% set probe_move_attach_length = printer["gcode_macro _USER_VARIABLES"].probe_move_attach_length %}

    # Safe Z for travel
    {% set probe_min_z_travel = printer["gcode_macro _USER_VARIABLES"].probe_min_z_travel|float %}

    # Set speed
    {% set probe_dock_speed = printer["gcode_macro _USER_VARIABLES"].probe_dock_speed * 60 %}
    {% set probe_dock_accel = printer["gcode_macro _USER_VARIABLES"].probe_dock_accel %}
    {% set travel_speed = printer["gcode_macro _USER_VARIABLES"].travel_speed * 60 %}
    {% set z_drop_speed = printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60 %}

    {% set probe_servo_enabled = printer["gcode_macro _USER_VARIABLES"].probe_servo_enabled %}
    {% set probe_type_enabled = printer["gcode_macro _USER_VARIABLES"].probe_type_enabled|string %}


    _ENTRY_POINT FUNCTION=ATTACH_PROBE

    # If x, y and z are not homed when using dockable probe
    {% if probe_type_enabled == "dockable" and not 'xyz' in printer.toolhead.homed_axes %}
        { action_raise_error("Must home all axis first to attach the probe!") }
    
    # Else if x and y are not homed when using dockable virtual probe
    {% elif probe_type_enabled == "dockable_virtual" and not 'xy' in printer.toolhead.homed_axes %}
        { action_raise_error("Must home XY axes first to attach the probe!") }

    # If probe not attached and locked
    {% elif not probe_attached and not probe_lock %}
        {% if verbose %}
            { action_respond_info("Attaching Probe") }
        {% endif %}

        {% if probe_type_enabled == "dockable_virtual" and not 'z' in printer.toolhead.homed_axes %}
            {% if verbose %}
                { action_respond_info("Attaching the probe can only be done during G28 if Z is not already homed") }
            {% endif %}
        {% endif %}

        # Move to safe Z
        {% if (printer.toolhead.position.z < probe_min_z_travel) %}
            {% if verbose %}
                { action_respond_info("Moving to a safe Z distance") }
            {% endif %}
            G0 Z{probe_min_z_travel} F{z_drop_speed}
        {% endif %}

        # Set the dock/undock acceleration prior to any movement
        {% set saved_accel = printer.toolhead.max_accel %}
        M204 S{probe_dock_accel}

        # Probe entry location
        _PROBE_MOVE_TO LOCATION={probe_before_attach_position} DISTANCE={probe_move_attach_length} SPEED={travel_speed}

        # Deploy dock using the servo (if available)
        {% if probe_servo_enabled %}
            _SERVO_DEPLOY ITEM="probe"
        {% endif %}

        # Pickup from Probe location
        _PROBE_MOVE_TO LOCATION='dock' SPEED={probe_dock_speed}
        
        # Get the probe out of the dock
        _PROBE_MOVE_TO LOCATION={probe_after_attach_position} DISTANCE={probe_move_attach_length} SPEED={probe_dock_speed}

        # Lift for safety
        G91
        G1 Z{probe_move_attach_length} F{probe_dock_speed} # lift for safety
        G90

        # Retract dock using the servo (if available)
        {% if probe_servo_enabled %}
            _SERVO_RETRACT ITEM="probe"
        {% endif %}

        # Reset acceleration values to what it was before
        SET_VELOCITY_LIMIT ACCEL={saved_accel}

        _CHECK_PROBE action=attach

    {% elif probe_lock %}
        {% if verbose %}
            { action_respond_info("Probe locked!") }
        {% endif %}

        # Probe attached, do nothing
        _CHECK_PROBE action=query

    {% else %}
        {% if verbose %}
            { action_respond_info("Probe already attached!") }
        {% endif %}

        # Probe attached, do nothing
        _CHECK_PROBE action=query

    {% endif %}
    _EXIT_POINT FUNCTION=ATTACH_PROBE

[gcode_macro _DOCK_PROBE]
description: Docks probe
gcode:
    # Get probe attach status
    {% set probe_attached = printer["gcode_macro _PROBE_VARIABLES"].probe_attached %}
    {% set probe_lock = printer["gcode_macro _PROBE_VARIABLES"].probe_lock %}
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}

    # Get Docking location
    {% set probe_dock_location_x, probe_dock_location_y = printer["gcode_macro _USER_VARIABLES"].probe_dock_location_xy|map('float') %}
    
    {% set probe_before_dock_position = printer["gcode_macro _USER_VARIABLES"].probe_before_dock_position|string %}
    {% set probe_after_dock_position = printer["gcode_macro _USER_VARIABLES"].probe_after_dock_position|string %}
    {% set probe_move_dock_length = printer["gcode_macro _USER_VARIABLES"].probe_move_dock_length %}

    # Safe Z for travel
    {% set probe_min_z_travel = printer["gcode_macro _USER_VARIABLES"].probe_min_z_travel|float %}

    # Set speed
    {% set probe_dock_speed = printer["gcode_macro _USER_VARIABLES"].probe_dock_speed * 60 %}
    {% set probe_dock_accel = printer["gcode_macro _USER_VARIABLES"].probe_dock_accel %}
    {% set travel_speed = printer["gcode_macro _USER_VARIABLES"].travel_speed * 60 %}
    {% set z_drop_speed = printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60 %}

    {% set probe_servo_enabled = printer["gcode_macro _USER_VARIABLES"].probe_servo_enabled %}

    # Probe stow height
    {% set probe_stow_z_height = printer["gcode_macro _USER_VARIABLES"].probe_stow_z_height|default(None) %}


    _ENTRY_POINT FUNCTION=DOCK_PROBE

    # If x, y and z are not homed when using dockable probe
    {% if probe_type_enabled == "dockable" and not 'xyz' in printer.toolhead.homed_axes %}
        { action_raise_error("Must home all axis first to dock the probe!") }
    
    # Else if x and y are not homed when using dockable virtual probe
    {% elif probe_type_enabled == "dockable_virtual" and not 'xy' in printer.toolhead.homed_axes %}
        { action_raise_error("Must home XY axes first to dock the probe!") }

    # If probe not attached and not locked
    {% elif probe_attached and not probe_lock %}
        {% if verbose %}
            { action_respond_info("Docking Probe") }
        {% endif %}

        {% if probe_type_enabled == "dockable_virtual" and not 'z' in printer.toolhead.homed_axes %}
            {% if verbose %}
                { action_respond_info("Docking the probe can only be done during G28 if Z is not already homed") }
            {% endif %}
        {% endif %}

        # Move to safe Z
        {% if (printer.toolhead.position.z < probe_min_z_travel) %}
            {% if verbose %}
                { action_respond_info("Moving to a safe Z distance") }
            {% endif %}
            G0 Z{probe_min_z_travel} F{z_drop_speed}
        {% endif %}

        # Set the dock/undock acceleration prior to any movement
        {% set saved_accel = printer.toolhead.max_accel %}
        M204 S{probe_dock_accel}

        # Move to probe entry location
        _PROBE_MOVE_TO LOCATION='right_over' DISTANCE={probe_move_dock_length} SPEED={travel_speed}
        _PROBE_MOVE_TO LOCATION={probe_before_dock_position} DISTANCE={probe_move_dock_length} SPEED={travel_speed}

        # Deploy dock using the servo (if available)
        {% if probe_servo_enabled %}
            _SERVO_DEPLOY ITEM="probe"
        {% endif %}

        # Move probe into dock
        _PROBE_MOVE_TO LOCATION='dock' SPEED={probe_dock_speed}

        # Move probe to stow z height if defined
        {% if probe_stow_z_height is not none %}
            G0 Z{probe_stow_z_height} F{z_drop_speed}
        {% endif %}

        # Get detach probe
        _PROBE_MOVE_TO LOCATION={probe_after_dock_position} DISTANCE={probe_move_dock_length} SPEED={probe_dock_speed}

        # Retract dock using the servo (if available)
        {% if probe_servo_enabled %}
            _SERVO_RETRACT ITEM="probe"
        {% endif %}

        # Reset acceleration values to what it was before
        SET_VELOCITY_LIMIT ACCEL={saved_accel}

        G4 P500
        _CHECK_PROBE action=dock

    {% elif probe_lock %}
        {% if verbose %}
            { action_respond_info("Probe locked!") }
        {% endif %}

        # Probe docked, do nothing
        _CHECK_PROBE action=query

    {% else %}
        {% if verbose %}
            { action_respond_info("Probe already docked!") }
        {% endif %}

        # Probe docked, do nothing
        _CHECK_PROBE action=query

    {% endif %}
    _EXIT_POINT FUNCTION=DOCK_PROBE


[gcode_macro _PROBE_MOVE_TO]
description: positioning toolhead for dock/attach operation
gcode: 
    {% set location = params.LOCATION|default('')|string %}
    {% set distance = params.DISTANCE|default(0)|float %}
    {% set speed = params.SPEED|default(0)|float %}

    {% set probe_dock_location_x, probe_dock_location_y, probe_dock_location_z = printer["gcode_macro _USER_VARIABLES"].probe_dock_location_xyz|map('float') %}

    # define dict for location direction
    {% set location_factor = {
        'left'  : { 'x': -1, 'y':  0, 'z':  0 },
        'right' : { 'x':  1, 'y':  0, 'z':  0 },
        'right_over' : { 'x':  1, 'y':  0, 'z':  1 },
        'front' : { 'x':  0, 'y': -1, 'z':  0 },
        'back'  : { 'x':  0, 'y':  1, 'z':  0 },
        'dock'  : { 'x':  0, 'y':  0, 'z':  0 },
        'over'  : { 'x':  0, 'y':  0, 'z':  1 },
        'under' : { 'x':  0, 'y':  0, 'z': -1 }
    } %}

    {% if location in location_factor %}
        G1 X{probe_dock_location_x + location_factor[location].x * distance} Y{probe_dock_location_y + location_factor[location].y * distance} Z{probe_dock_location_z + location_factor[location].z * distance} F{speed}
    {% else %}
        { action_raise_error("Error in probe attach/dock movement. Check the directions in your variables.cfg file!") }
    {% endif %}