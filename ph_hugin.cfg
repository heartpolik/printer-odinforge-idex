[mcu hugin]
canbus_uuid: 62171040ce8f ##red

[adxl345]
cs_pin: hugin:ADXL_CS
spi_software_sclk_pin: hugin:ADXL_SCLK
spi_software_mosi_pin: hugin:ADXL_MOSI
spi_software_miso_pin: hugin:ADXL_MISO

[resonance_tester]
# Split into accel_chip_x/accel_chip_y (both default to the toolhead chip) instead of a
# single accel_chip, so the temporary Y-axis bed accelerometer toggle (overrides.cfg /
# accel_bed_ytest.cfg) can override just accel_chip_y without Klipper flagging accel_chip
# as an unused/invalid option (the two forms can't coexist in one merged config).
accel_chip_x: adxl345
accel_chip_y: adxl345
probe_points:
    60,60,20  # an example

[temperature_sensor hugin_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: hugin
min_temp: 0
max_temp: 100

[extruder]
step_pin: hugin:E_STEP
dir_pin: !hugin:E_DIR
enable_pin: !hugin:E_ENABLE
heater_pin: hugin:E_HEATER
sensor_pin: hugin:E_TEMPERATURE

rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 110
max_extrude_cross_section: 5
sensor_type: ATC Semitec 104GT-2
min_temp: 10
max_temp: 270
max_power: 1.0
min_extrude_temp: 172
pressure_advance: 0.0475
pressure_advance_smooth_time: 0.040

control: pid
pid_kp: 36.698
pid_ki: 4.369
pid_kd: 77.065

# [probe]
# pin: ^hugin:PROBE_INPUT

[fan_generic hugin_part_fan]
pin: hugin:PART_FAN

[heater_fan hugin_hotend_fan]
pin: hugin:E_FAN
heater: extruder

[tmc2209 extruder]
uart_pin: hugin:E_TMCUART

[output_pin probe_enable]
pin: hugin:SERVO_PIN
value: 0
[gcode_macro ACTIVATE_PROBE]
gcode:
  SET_PIN PIN=probe_enable VALUE=1
[gcode_macro DEACTIVATE_PROBE]
gcode:
  SET_PIN PIN=probe_enable VALUE=0
[probe]
pin: ^!hugin:PROBE_INPUT # For V1 version, set to ^PC13 for high-level trigger; for V2 version,
deactivate_on_each_sample: False
x_offset: -28.45 # Actual offset of the MicroProbe installation
y_offset: 23.6 # Actual offset of the MicroProbe installation
z_offset: 0.561 # Actual offset of the MicroProbe installation

speed: 5.0
activate_gcode:
  ACTIVATE_PROBE
  G4 P500 # Allow 500 milliseconds for the probe to deploy
deactivate_gcode:
  DEACTIVATE_PROBE

