#####################################################################
# Odin Forge - IDEX printer (Klipper + Klippain)
#####################################################################
# Entry file. Order matters: Klippain's stock modules come first, this printer's files
# (odin/) after them, so a section/option defined in odin/ overrides Klippain's version.
#
#   odin/variables.cfg        Klippain _USER_VARIABLES (all macro settings) + save_variables
#   odin/hardware/            boards, toolheads, axes, bed, electronics
#   odin/motion.cfg           speed/accel limits, input shaper, arcs, skew
#   odin/macros/              IDEX tool change, part fans, homing, START_PRINT tweaks
#
# The full menu of Klippain modules (other kinematics, probes, displays, ...) is in
# klippain_config/user_templates/printer.cfg on the printer.


#-------------------------------------------------------------------#
#   KLIPPAIN MODULES                                                #
#-------------------------------------------------------------------#

[include config/kinematics/cartesian.cfg]

## Mainboard: BTT Manta M8P v2.0 pin definitions (aliases in odin/hardware/mainboard.cfg)
[include config/mcu_definitions/main/BTT_Manta_M8P_v2.0.cfg]

## Hardware
[include config/hardware/extruder/cw2.cfg]
[include config/hardware/bed_heaters/keenovo.cfg] # NTC100K bed thermistor
[include config/hardware/fans/rpi_fan.cfg]
# Part/hotend fans: per toolhead, see odin/hardware/toolhead_*.cfg (Klippain's part_fan.cfg not used)
[include config/hardware/temperature_sensors/rpi_temp.cfg]
[include config/hardware/temperature_sensors/mcu_temp.cfg]
[include config/hardware/lights/status_leds.cfg] # StealthBurner style LEDs, on hugin
[include config/hardware/filament_sensors/switch_sensor.cfg] # pin on hugin

## TMC drivers (X/Y drivers are defined directly in odin/hardware/axis_*.cfg)
[include config/hardware/axis/Z/TMC/TMC2209_1-Motor.cfg]
[include config/hardware/extruder/TMC/TMC2209.cfg]

## Software
[include config/software/bed_mesh/bed_mesh_250mm.cfg]
[include config/software/sensorless_homing/sensorless_TMC2209.cfg]
[include config/software/firmware_rectraction.cfg]
[include config/software/tilting/z_tilt_250mm.cfg]
# Klippain's input_shaper.cfg is not used: dual_carriage needs per-carriage SET_INPUT_SHAPER (odin/motion.cfg)


#-------------------------------------------------------------------#
#   ODIN FORGE                                                      #
#-------------------------------------------------------------------#

[include odin/variables.cfg]

[include odin/hardware/mainboard.cfg]
[include odin/hardware/toolhead_hugin.cfg]
[include odin/hardware/toolhead_munin.cfg]
[include odin/hardware/axis_x.cfg]
[include odin/hardware/axis_y.cfg]
[include odin/hardware/axis_z.cfg]
[include odin/hardware/bed.cfg]
[include odin/hardware/electronics.cfg]

[include odin/motion.cfg]

[include odin/macros/part_fan.cfg]
[include odin/macros/idex.cfg]
[include odin/macros/homing.cfg]
[include odin/macros/start_print.cfg]

